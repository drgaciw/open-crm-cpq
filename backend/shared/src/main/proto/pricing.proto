syntax = "proto3";

package com.opencrm.shared.proto;

option java_multiple_files = true;
option java_package = "com.opencrm.shared.proto";

service PricingGrpcService {
  rpc CalculatePrice (CalculatePriceRequest) returns (CalculatePriceResponse);
}

message CalculatePriceRequest {
    string product_id = 1;
    map<string, string> configuration = 2;
    int32 quantity = 3;
}

message CalculatePriceResponse {
    string base_price = 1;
    string calculated_price = 2;
    string currency_code = 3;
    repeated Discount applied_discounts = 4;
}

message Discount {
    string rule_id = 1;
    string amount = 2;
    string description = 3;
}
