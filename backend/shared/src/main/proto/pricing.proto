syntax = "proto3";

package com.cpq.pricing;

option java_package = "com.cpq.shared.grpc.pricing";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "shared.proto";

message CalculatePriceRequest {
  string product_id = 1;
  int32 quantity = 2;
  string currency = 3;
  repeated ConfigurationOption configuration = 4;
}

message ConfigurationOption {
  string key = 1;
  string value = 2;
}

message CalculatePriceResponse {
  Money total_price = 1;
  Money base_price = 2;
  Money discount_amount = 3;
  bool requires_approval = 4;
  string approval_reason = 5;
}

message Money {
  string currency = 1;
  int64 amount_minor_units = 2; // e.g., cents for USD
}