version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: opencrm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: opencrm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: opencrm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka (KRaft, single node) for the ADR-010/ADR-018 event path. Opt-in: docker compose --profile events up -d
  # Containers use kafka:29092; services started on the host (mvnw / java -jar) use localhost:9092.
  kafka:
    profiles: [events]
    image: apache/kafka:4.4.0
    container_name: opencrm-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 10


  # CRM Service
  crm-service:
    build:
      context: ./services/crm-service
      dockerfile: Dockerfile
    container_name: opencrm-crm-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opencrm?currentSchema=crm
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_FLYWAY_SCHEMAS: crm
      # ADR-018 D8 dual run: also consume quote acceptance from Kafka. Needs `--profile events` (Kafka) and the
      # quote-service relay (OPENCRM_OUTBOX_RELAY_ENABLED=true); off by default.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CRM_QUOTE_ACCEPTED_KAFKA_ENABLED: ${CRM_QUOTE_ACCEPTED_KAFKA_ENABLED:-false}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: opencrm
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  # Price Book Service
  pricebook-service:
    build:
      context: ./services/pricebook-service
      dockerfile: Dockerfile
    container_name: opencrm-pricebook-service
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opencrm?currentSchema=pricing
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: opencrm
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  # Pricing Service
  pricing-service:
    build:
      context: ./services/pricing-service
      dockerfile: Dockerfile
    container_name: opencrm-pricing-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opencrm?currentSchema=pricing
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_FLYWAY_SCHEMAS: pricing
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: opencrm
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PRICEBOOK_SERVICE_URL: http://pricebook-service:8089
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # ADR-018 D1: relay is opt-in; enabling replays any unpublished outbox backlog
      OPENCRM_OUTBOX_RELAY_ENABLED: ${OPENCRM_OUTBOX_RELAY_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  # Product Service
  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: opencrm-product-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opencrm?currentSchema=product
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_FLYWAY_SCHEMAS: product
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: opencrm
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # ADR-018 D1: relay is opt-in; enabling replays any unpublished outbox backlog
      OPENCRM_OUTBOX_RELAY_ENABLED: ${OPENCRM_OUTBOX_RELAY_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  # Quote Service
  quote-service:
    build:
      context: ./services/quote-service
      dockerfile: Dockerfile
    container_name: opencrm-quote-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opencrm?currentSchema=quote
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_FLYWAY_SCHEMAS: quote
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: opencrm
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PRICING_SERVICE_URL: http://pricing-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # ADR-018 D1: relay is opt-in; enabling replays any unpublished outbox backlog
      OPENCRM_OUTBOX_RELAY_ENABLED: ${OPENCRM_OUTBOX_RELAY_ENABLED:-false}
      APPROVAL_ROUTING_SERVICE_URL: http://approval-routing:8085
      CONFIGURATION_ENGINE_URL: http://configuration-engine:8088
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  # CPQ event consumers (ADR-010 / ADR-018): approvals, documents, contracts, configuration.
  # Opt-in with Kafka: docker compose --profile events up -d  (build jars first: ./mvnw -DskipTests package)
  approval-routing:
    profiles: [events]
    build:
      context: ./services/approval-routing
      dockerfile: Dockerfile
    container_name: opencrm-approval-routing
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: opencrm
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  document-generation:
    profiles: [events]
    build:
      context: ./services/document-generation
      dockerfile: Dockerfile
    container_name: opencrm-document-generation
    ports:
      - "8086:8086"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: opencrm
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  contract-asset-management:
    profiles: [events]
    build:
      context: ./services/contract-asset-management
      dockerfile: Dockerfile
    container_name: opencrm-contract-asset-management
    ports:
      - "8087:8087"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: opencrm
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  configuration-engine:
    profiles: [events]
    build:
      context: ./services/configuration-engine
      dockerfile: Dockerfile
    container_name: opencrm-configuration-engine
    ports:
      - "8088:8088"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: opencrm
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCT_SERVICE_URL: http://product-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  # API Gateway Service
  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    container_name: opencrm-gateway
    ports:
      - "8080:8080"
    environment:
      CRM_SERVICE_URI: http://crm-service:8081
      PRICING_SERVICE_URI: http://pricing-service:8082
      PRICEBOOK_SERVICE_URI: http://pricebook-service:8089
      PRODUCT_SERVICE_URI: http://product-service:8083
      QUOTE_SERVICE_URI: http://quote-service:8084
      APPROVAL_ROUTING_URI: http://approval-routing:8085
      DOCUMENT_GENERATION_URI: http://document-generation:8086
      CONTRACT_ASSET_MANAGEMENT_URI: http://contract-asset-management:8087
      CONFIGURATION_ENGINE_URI: http://configuration-engine:8088
      AI_SERVICE_URI: http://ai-service:8090
      FRONTEND_URL: http://localhost:4200
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      crm-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      pricebook-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      quote-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  # Opt-in AI runtime. Azure remains the default provider during ADR-014 rollout.
  ai-service:
    profiles: [ai]
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      DB_HOST: postgres
      DB_NAME: opencrm
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      OPENCRM_GATEWAY_BASE_URL: http://gateway-service:8080
      OPENCRM_AI_AGENTS_ENABLED: ${OPENCRM_AI_AGENTS_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: opencrm-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

  # Redis Commander for Redis management (optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: opencrm-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8095:8081"   # was 8085; approval-routing owns 8085
    depends_on:
      - redis
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: opencrm-network
