server:
  port: 8084

spring:
  application:
    name: quote-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opencrm}?currentSchema=quote
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: quote
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: quote
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 600000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: quote-service-renewal
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # Boot 4 + azure-spring 5.x: disable verifier and Event Hubs Kafka OAuth2
  # (KafkaProperties moved; ClassNotFoundException without spring-boot kafka starter).
  autoconfigure:
    exclude:
      - com.azure.spring.cloud.autoconfigure.implementation.context.AzureTokenCredentialAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.compatibility.AzureCompatibilityVerifierAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.aadb2c.configuration.AadB2cAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.aadb2c.configuration.AadB2cResourceServerAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.kafka.AzureEventHubsKafkaOAuth2AutoConfiguration
  cloud:
    azure:
      compatibility-verifier:
        enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.opencrm: DEBUG

# Inter-service communication
services:
  pricing:
    url: ${PRICING_SERVICE_URL:http://localhost:8082}
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
  # ADR-016 step 2: direct, with a service token; quote-service never calls the gateway.
  configuration-engine:
    url: ${CONFIGURATION_ENGINE_URL:http://localhost:8088}
  approval-routing:
    url: ${APPROVAL_ROUTING_SERVICE_URL:http://localhost:8085}

# Dual-read legacy local approval_requests when routing has no row (pre-cutover IDs).
approvals:
  legacy-local-read-enabled: ${APPROVALS_LEGACY_LOCAL_READ:true}
  # Requester and approver come from the token, recorded by approval-routing (ADR-016 step 4).
  # There is no switch for unverified actors: only opencrm.security.mode=dev allows them.

# Jev advisory decision support (ADR-015). Inert by default: every flag is false and the
# transport is a no-op, so nothing is sent. JEV_API_KEY deliberately has an empty default so
# the service boots without it; a blank key forces the no-op transport.
opencrm:
  kafka:
    # ADR-018 D6 inbox for the renewal consumer. The ramp gate below stays false; this only creates the claim table's writer.
    inbox:
      enabled: true
  jev:
    enabled: ${JEV_ENABLED:false}
    transport: ${JEV_TRANSPORT:noop}
    api-key: ${JEV_API_KEY:}
    base-url: ${JEV_BASE_URL:}
    # Pinned evaluator model; a *latest alias is rejected. Ignored by wire-format FACADE.
    model: ${JEV_MODEL:}
    wire-format: ${JEV_WIRE_FORMAT:NATIVE}
    daily-call-budget: ${JEV_DAILY_CALL_BUDGET:500}
    quote-tier-suggestion:
      enabled: ${JEV_QUOTE_TIER_SUGGESTION_ENABLED:false}
      rubric-version: quote-tier-v1
      min-confidence: 0.6
  pricing:
    ramp:
      enabled: false
      max-periods: 36

---
# Local and CI only: the well-known development database password. The default profile has no secret
# defaults, so a deployment without DB_PASSWORD fails at startup instead of trying "postgres" (ADR-016 step 5).
spring:
  config:
    activate:
      on-profile: dev | test
  datasource:
    password: ${DB_PASSWORD:postgres}
