spring:
  datasource:
    url: jdbc:tc:postgresql:16:///testdb?currentSchema=quote
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: quote
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: simple

services:
  pricing:
    url: http://localhost:8082
  product:
    url: http://localhost:8083
  gateway:
    url: http://localhost:8080
  approval-routing:
    url: http://localhost:8085

approvals:
  legacy-local-read-enabled: true

logging:
  level:
    com.opencrm: DEBUG
