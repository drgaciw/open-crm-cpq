spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///opencrm?currentSchema=quote
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: quote
  flyway:
    enabled: true
    schemas: quote
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: none

services:
  pricing:
    url: http://localhost:8082
  product:
    url: http://localhost:8083

logging:
  level:
    com.opencrm: DEBUG
