spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///opencrm?currentSchema=contract
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: contract
  flyway:
    enabled: true
    schemas: contract
    locations: classpath:db/migration
  cache:
    type: none

logging:
  level:
    com.opencrm: DEBUG
