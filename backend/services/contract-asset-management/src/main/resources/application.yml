spring:
  # Same Azure auto-configuration excludes as the running producer services (quote/product/pricing):
  # spring-cloud-azure's B2C, token-credential, compatibility-verifier and Event Hubs Kafka OAuth2
  # auto-configurations block local boot on Spring Boot 4 (ADR-018 D1 / ADR-010).
  autoconfigure:
    exclude:
      - com.azure.spring.cloud.autoconfigure.implementation.context.AzureTokenCredentialAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.compatibility.AzureCompatibilityVerifierAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.aadb2c.configuration.AadB2cAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.aadb2c.configuration.AadB2cResourceServerAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.kafka.AzureEventHubsKafkaOAuth2AutoConfiguration
  cloud:
    azure:
      compatibility-verifier:
        enabled: false
  application:
    name: contract-asset-management
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opencrm}?currentSchema=${DB_SCHEMA:contract}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:contract}
  flyway:
    enabled: true
    # Existing standalone deployments must retain DB_NAME and set DB_SCHEMA=public.
    # Refuse to baseline unknown data; preserve an existing Flyway history instead.
    baseline-on-migrate: false
    default-schema: ${DB_SCHEMA:contract}
    schemas: ${DB_SCHEMA:contract}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: contract-asset-management
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Resilience4j rate limiter for ERP ACL
resilience4j:
  ratelimiter:
    instances:
      erpSync:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 5s

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# ADR-018 D6: inbox dedupe for the quote-accepted consumer (processed_events, V1_3), and the ERP sync that
# the consumer queues instead of calling the ERP inside its Kafka transaction.
opencrm:
  kafka:
    inbox:
      enabled: true
  erp-sync:
    enabled: ${ERP_SYNC_ENABLED:true}
    poll-interval: PT30S
    batch-size: 20
    stale-after: PT10M

---
# Local and CI only: the well-known development database password. The default profile has no secret
# defaults, so a deployment without DB_PASSWORD fails at startup instead of trying "postgres" (ADR-016 step 5).
spring:
  config:
    activate:
      on-profile: dev | test
  datasource:
    password: ${DB_PASSWORD:postgres}
