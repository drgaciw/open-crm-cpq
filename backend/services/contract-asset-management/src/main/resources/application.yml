spring:
  application:
    name: contract-asset-management
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cpq_contract}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: record
    consumer:
      enable-auto-commit: false
      group-id: contract-asset-management
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Resilience4j rate limiter for ERP ACL
resilience4j:
  ratelimiter:
    instances:
      erpSync:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 5s

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

oms:
  activation-consumer-enabled: ${OMS_ACTIVATION_CONSUMER_ENABLED:false}
  trusted-source-scopes: ${OMS_TRUSTED_SOURCE_SCOPES:}
  managed-customers: ${OMS_MANAGED_CUSTOMERS:}
  source-consumer-enabled: ${OMS_SOURCE_CONSUMER_ENABLED:false}
  trusted-producer-configured: ${OMS_TRUSTED_PRODUCER_CONFIGURED:false}
  quote-producer-principal: ${OMS_QUOTE_PRODUCER_PRINCIPAL:}
  activation-producer-principal: ${OMS_ACTIVATION_PRODUCER_PRINCIPAL:}
