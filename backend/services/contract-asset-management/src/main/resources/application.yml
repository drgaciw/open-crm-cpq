spring:
  application:
    name: contract-asset-management
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opencrm}?currentSchema=${DB_SCHEMA:contract}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:contract}
  flyway:
    enabled: true
    # Existing standalone deployments must retain DB_NAME and set DB_SCHEMA=public.
    # Refuse to baseline unknown data; preserve an existing Flyway history instead.
    baseline-on-migrate: false
    default-schema: ${DB_SCHEMA:contract}
    schemas: ${DB_SCHEMA:contract}
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: contract-asset-management
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Resilience4j rate limiter for ERP ACL
resilience4j:
  ratelimiter:
    instances:
      erpSync:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 5s

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
