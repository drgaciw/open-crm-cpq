server:
  port: 8091
  error:
    include-message: never
spring:
  application:
    name: order-management
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opencrm}?currentSchema=order_management
    username: ${OMS_DB_USERNAME:oms_app}
    password: ${OMS_DB_PASSWORD:}
  flyway:
    default-schema: order_management
    schemas: order_management
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    properties:
      security.protocol: ${OMS_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    consumer:
      group-id: order-management
      enable-auto-commit: false
      max-poll-records: 50
      fetch-max-wait: 500ms
      properties:
        max.partition.fetch.bytes: 1048576
        fetch.max.bytes: 5242880
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
oms:
  advisory:
    ttl: PT15M
  recovery:
    enabled: ${OMS_RECOVERY_ENABLED:false}
    scopes: ${OMS_RECOVERY_SCOPES:}
    batch-size: ${OMS_RECOVERY_BATCH_SIZE:100}
    scan-delay-ms: ${OMS_RECOVERY_SCAN_DELAY_MS:5000}
    metrics-poll-ms: ${OMS_RECOVERY_METRICS_POLL_MS:30000}
    metrics-query-timeout-seconds: ${OMS_RECOVERY_METRICS_QUERY_TIMEOUT_SECONDS:5}
  execution:
    enabled: ${OMS_EXECUTION_ENABLED:false}
    callback-enabled: ${OMS_ACTIVATION_CALLBACK_ENABLED:false}
    allowed-scopes: ${OMS_EXECUTION_ALLOWED_SCOPES:}
  outbox-relay:
    enabled: ${OMS_OUTBOX_RELAY_ENABLED:false}
  messaging:
    producer-acl-verified: ${OMS_PRODUCER_ACL_VERIFIED:false}
    trusted-producer-principals: ${OMS_TRUSTED_PRODUCER_PRINCIPALS:}
  scope-id: ${OMS_SCOPE_ID:}
  intake-enabled: ${OMS_INTAKE_ENABLED:false}
  snapshot-consumer-enabled: ${OMS_SNAPSHOT_CONSUMER_ENABLED:false}
  trusted-source-scopes: ${OMS_TRUSTED_SOURCE_SCOPES:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
logging:
  level:
    org.springframework.web: INFO
    org.springframework.jdbc.core: INFO

# ADR-015 OMS extension: shadow only. No UI or business decision depends on these switches.
opencrm:
  security:
    mode: jwt
  jev:
    enabled: ${JEV_ENABLED:false}
    transport: ${JEV_TRANSPORT:noop}
    api-key: ${JEV_API_KEY:}
    base-url: ${JEV_BASE_URL:}
    model: ${JEV_MODEL:}
    wire-format: ${JEV_WIRE_FORMAT:NATIVE}
    daily-call-budget: ${JEV_DAILY_CALL_BUDGET:100}
    max-concurrent: 1
    max-retries: 0
    connect-timeout: 2s
    read-timeout: 5s
    max-body-bytes: 8192
    oms-exception-triage:
      enabled: ${JEV_OMS_EXCEPTION_TRIAGE_ENABLED:false}
      rubric-version: oms-exception-triage-v1
      min-confidence: 0.9
