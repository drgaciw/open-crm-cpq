# Merge this job and rule_files entry into the deployment's existing Prometheus config.
# Provision a rotated monitor token: issuer/audience order-management, deployment scope_id,
# permission oms:monitor. Never commit the credential file or use an operator token.
rule_files:
  - /etc/prometheus/oms/operations-alerts.yml
scrape_configs:
  - job_name: oms-pilot
    scheme: https
    metrics_path: /actuator/prometheus
    scrape_interval: 30s
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/oms-monitor-token
    tls_config:
      ca_file: /run/secrets/oms-monitor-ca.pem
    static_configs:
      - targets: [oms-pilot.internal.example:443]
