server:
  port: 8081

spring:
  application:
    name: crm-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opencrm}?currentSchema=crm
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: crm
        default_batch_fetch_size: 25
        format_sql: true
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    schemas: crm
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
  # security lib pulls spring-cloud-azure 5.8 (Boot 3-era). Keep Boot 4.0.6;
  # disable the verifier instead of downgrading (parent surefire + ITs do the same).
  autoconfigure:
    exclude:
      - com.azure.spring.cloud.autoconfigure.implementation.context.AzureTokenCredentialAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.compatibility.AzureCompatibilityVerifierAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.aadb2c.configuration.AadB2cAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.aadb2c.configuration.AadB2cResourceServerAutoConfiguration
      # Boot 4 moved KafkaProperties; azure-spring 5.x's Event Hubs Kafka OAuth2 config cannot load with the starter.
      - com.azure.spring.cloud.autoconfigure.implementation.kafka.AzureEventHubsKafkaOAuth2AutoConfiguration
  cloud:
    azure:
      compatibility-verifier:
        enabled: false
  # ADR-018 D8: quote acceptance arrives on cpq.quote.status.accepted (see opencrm.crm.quote-accepted below).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: crm-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.90, 0.95, 0.99
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms

logging:
  level:
    com.opencrm: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

# Jev advisory decision support (ADR-015). Inert by default: every flag is false and the
# transport is a no-op, so nothing is sent. JEV_API_KEY deliberately has an empty default so
# the service boots without it; a blank key forces the no-op transport.
opencrm:
  jev:
    enabled: ${JEV_ENABLED:false}
    transport: ${JEV_TRANSPORT:noop}
    api-key: ${JEV_API_KEY:}
    base-url: ${JEV_BASE_URL:}
    # Pinned evaluator model; a *latest alias is rejected. Ignored by wire-format FACADE.
    model: ${JEV_MODEL:}
    wire-format: ${JEV_WIRE_FORMAT:NATIVE}
    daily-call-budget: ${JEV_DAILY_CALL_BUDGET:500}
    lead-score:
      enabled: ${JEV_LEAD_SCORE_ENABLED:false}
      rubric-version: lead-score-v1
      min-confidence: 0.6
    duplicate-hints:
      enabled: ${JEV_DUPLICATE_HINTS_ENABLED:false}
      rubric-version: duplicate-pair-v1
      min-confidence: 0.0
      # NAMES sends organization names and needs the ADR-015 data-processing sign-off.
      pii-mode: FEATURES_ONLY
  crm:
    # Local pg_trgm candidate lookup only; no data leaves the service.
    duplicate-hints:
      enabled: ${CRM_DUPLICATE_HINTS_ENABLED:false}
    # ADR-018 D8 dual run: also take quote acceptance from Kafka. Turn on together with quote-service's outbox
    # relay (OPENCRM_OUTBOX_RELAY_ENABLED), which is what puts the events on the topic. Both channels claim the
    # quote UUID in processed_events, so a deal is marked WON once whichever arrives first.
    quote-accepted:
      kafka:
        enabled: ${CRM_QUOTE_ACCEPTED_KAFKA_ENABLED:false}
  kafka:
    inbox:
      # processed_events (V5): dedupe store for quote acceptance, shared by the Redis and Kafka listeners.
      enabled: true

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

logging:
  level:
    com.opencrm: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

logging:
  level:
    com.opencrm: INFO
    org.hibernate.SQL: WARN

---
# Local and CI only: the well-known development database password. The default profile has no secret
# defaults, so a deployment without DB_PASSWORD fails at startup instead of trying "postgres" (ADR-016 step 5).
spring:
  config:
    activate:
      on-profile: dev | test
  datasource:
    password: ${DB_PASSWORD:postgres}
