security:
  open: true

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: crm
  flyway:
    enabled: true
    schemas: crm
    locations: classpath:db/migration
  cache:
    type: none
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.opencrm: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
