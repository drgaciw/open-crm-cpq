security:
  open: true

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: crm
  flyway:
    enabled: true
    schemas: crm
    locations: classpath:db/migration
  cache:
    type: none
  data:
    redis:
      host: localhost
      port: 6379
  # security lib pulls spring-cloud-azure 5.8 (Boot 3-era); exclude for Boot 4 ITs.
  autoconfigure:
    exclude:
      - com.azure.spring.cloud.autoconfigure.implementation.context.AzureTokenCredentialAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.compatibility.AzureCompatibilityVerifierAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.kafka.AzureEventHubsKafkaOAuth2AutoConfiguration
  cloud:
    azure:
      compatibility-verifier:
        enabled: false

logging:
  level:
    com.opencrm: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
