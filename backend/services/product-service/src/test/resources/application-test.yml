spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///opencrm?currentSchema=product
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: product
  flyway:
    enabled: true
    schemas: product
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: none

logging:
  level:
    com.opencrm: DEBUG
