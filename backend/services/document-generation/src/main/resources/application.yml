spring:
  application:
    name: document-generation
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opencrm}?currentSchema=${DB_SCHEMA:document}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:document}
  flyway:
    enabled: true
    # Existing standalone deployments must retain DB_NAME and set DB_SCHEMA=public.
    # Refuse to baseline unknown data; preserve an existing Flyway history instead.
    baseline-on-migrate: false
    default-schema: ${DB_SCHEMA:document}
    schemas: ${DB_SCHEMA:document}
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: document-generation
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
