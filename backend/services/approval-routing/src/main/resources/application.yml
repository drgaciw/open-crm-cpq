spring:
  application:
    name: approval-routing
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cpq_approval}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: approval-routing
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Jev advisory decision support (ADR-015). Inert by default: every flag is false and the
# transport is a no-op, so nothing is sent. JEV_API_KEY deliberately has an empty default so
# the service boots without it; a blank key forces the no-op transport.
opencrm:
  jev:
    enabled: ${JEV_ENABLED:false}
    transport: ${JEV_TRANSPORT:noop}
    api-key: ${JEV_API_KEY:}
    base-url: ${JEV_BASE_URL:}
    # Pinned evaluator model; a *latest alias is rejected. Ignored by wire-format FACADE.
    model: ${JEV_MODEL:}
    wire-format: ${JEV_WIRE_FORMAT:NATIVE}
    daily-call-budget: ${JEV_DAILY_CALL_BUDGET:500}
    discount-tier-shadow:
      enabled: ${JEV_DISCOUNT_TIER_SHADOW_ENABLED:false}
      rubric-version: tier-v1-thresholds
      min-confidence: 0.0
