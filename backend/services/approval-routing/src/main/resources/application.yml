spring:
  # Same Azure auto-configuration excludes as the running producer services (quote/product/pricing):
  # spring-cloud-azure's B2C, token-credential, compatibility-verifier and Event Hubs Kafka OAuth2
  # auto-configurations block local boot on Spring Boot 4 (ADR-018 D1 / ADR-010).
  autoconfigure:
    exclude:
      - com.azure.spring.cloud.autoconfigure.implementation.context.AzureTokenCredentialAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.compatibility.AzureCompatibilityVerifierAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.aadb2c.configuration.AadB2cAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.aadb2c.configuration.AadB2cResourceServerAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.kafka.AzureEventHubsKafkaOAuth2AutoConfiguration
  cloud:
    azure:
      compatibility-verifier:
        enabled: false
  application:
    name: approval-routing
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opencrm}?currentSchema=${DB_SCHEMA:approval}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:approval}
  flyway:
    enabled: true
    # Existing standalone deployments must retain DB_NAME and set DB_SCHEMA=public.
    # Refuse to baseline unknown data; preserve an existing Flyway history instead.
    baseline-on-migrate: false
    default-schema: ${DB_SCHEMA:approval}
    schemas: ${DB_SCHEMA:approval}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: approval-routing
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Jev advisory decision support (ADR-015). Inert by default: every flag is false and the
# transport is a no-op, so nothing is sent. JEV_API_KEY deliberately has an empty default so
# the service boots without it; a blank key forces the no-op transport.
opencrm:
  kafka:
    inbox:
      # ADR-018 D6: consumers deduplicate on the eventId header via processed_events (V1_5).
      enabled: true
  jev:
    enabled: ${JEV_ENABLED:false}
    transport: ${JEV_TRANSPORT:noop}
    api-key: ${JEV_API_KEY:}
    base-url: ${JEV_BASE_URL:}
    # Pinned evaluator model; a *latest alias is rejected. Ignored by wire-format FACADE.
    model: ${JEV_MODEL:}
    wire-format: ${JEV_WIRE_FORMAT:NATIVE}
    daily-call-budget: ${JEV_DAILY_CALL_BUDGET:500}
    discount-tier-shadow:
      enabled: ${JEV_DISCOUNT_TIER_SHADOW_ENABLED:false}
      rubric-version: tier-v1-thresholds
      min-confidence: 0.0
