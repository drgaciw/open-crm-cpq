spring:
  application:
    name: ai-service
  
  # Redis State Store
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  # DB for Audit Logger
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opencrm}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      schema: ai
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ai

  # Azure OpenAI Configuration
  ai:
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY:mock-key}
        endpoint: ${AZURE_OPENAI_ENDPOINT:https://mock-endpoint.openai.azure.com}
        chat:
          options:
            deployment-name: gpt-4o

server:
  port: 8086

opencrm:
  ai:
    agents:
      enabled: ${OPENCRM_AI_AGENTS_ENABLED:false}
    mcp:
      clients:
        sequential-thinking:
          enabled: ${OPENCRM_AI_MCP_SEQUENTIAL_THINKING_ENABLED:false}
          endpoint: ${OPENCRM_AI_MCP_SEQUENTIAL_THINKING_ENDPOINT:http://localhost:3101}
        context7:
          enabled: ${OPENCRM_AI_MCP_CONTEXT7_ENABLED:false}
          endpoint: ${OPENCRM_AI_MCP_CONTEXT7_ENDPOINT:http://localhost:3102}
        puppeteer:
          enabled: ${OPENCRM_AI_MCP_PUPPETEER_ENABLED:false}
          endpoint: ${OPENCRM_AI_MCP_PUPPETEER_ENDPOINT:http://localhost:3103}

logging:
  level:
    com.opencrm.ai: DEBUG
