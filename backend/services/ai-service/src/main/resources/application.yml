spring:
  application:
    name: ai-service
  threads:
    virtual:
      enabled: true

  # Redis State Store
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  # DB for Audit Logger
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opencrm}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      schema: ai
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ai

  # Keep AI migrations and their history in the service's own schema.
  flyway:
    schemas: ai
    default-schema: ai

  ai:
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY}
        endpoint: ${AZURE_OPENAI_ENDPOINT}
        chat:
          options:
            deployment-name: gpt-4o

server:
  port: 8090

opencrm:
  gateway:
    base-url: ${OPENCRM_GATEWAY_BASE_URL:http://localhost:8080}
  # Azure remains the default provider until the opt-in rollout is configured.
  ai:
    selection:
      execution-enabled: ${OPENCRM_AI_SELECTION_EXECUTION_ENABLED:false}
    agents:
      enabled: ${OPENCRM_AI_AGENTS_ENABLED:false}

logging:
  level:
    com.opencrm.ai: DEBUG
