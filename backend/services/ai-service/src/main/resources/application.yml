spring:
  application:
    name: ai-service
  
  # Redis State Store
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  # DB for Audit Logger
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opencrm}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      schema: ai
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ai

  # Azure OpenAI Configuration
  ai:
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY}
        endpoint: ${AZURE_OPENAI_ENDPOINT}
        chat:
          options:
            deployment-name: gpt-4o

server:
  port: 8086

opencrm:
  ai:
    agents:
      enabled: ${OPENCRM_AI_AGENTS_ENABLED:false}

logging:
  level:
    com.opencrm.ai: DEBUG
