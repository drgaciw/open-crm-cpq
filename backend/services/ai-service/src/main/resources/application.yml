spring:
  application:
    name: ai-service
  # The API-key Spring AI client does not use Azure 5.8's Boot 3 credential bootstrap.
  autoconfigure:
    exclude:
      - com.azure.spring.cloud.autoconfigure.implementation.context.AzureTokenCredentialAutoConfiguration
  cloud:
    azure:
      compatibility-verifier:
        enabled: false
  threads:
    virtual:
      enabled: true

  # Redis State Store
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  # DB for Audit Logger
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opencrm}
    username: ${DB_USER:postgres}
    password: ${DB_PASS}
    hikari:
      schema: ai
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ai

  # Keep AI migrations and their history in the service's own schema.
  flyway:
    schemas: ai
    default-schema: ai

  ai:
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY}
        endpoint: ${AZURE_OPENAI_ENDPOINT}
        chat:
          options:
            deployment-name: gpt-4o

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

opencrm:
  gateway:
    base-url: ${OPENCRM_GATEWAY_BASE_URL:http://localhost:8080}
  # Azure remains the default provider until the opt-in rollout is configured.
  ai:
    selection:
      execution-enabled: ${OPENCRM_AI_SELECTION_EXECUTION_ENABLED:false}
    agents:
      enabled: ${OPENCRM_AI_AGENTS_ENABLED:false}

ai:
  agent-task:
    dispatcher:
      enabled: false
      claim-limit: 10
      lease: 30s
      poll-interval: 5s
    default-max-attempts: 5
    default-priority: 0
    retry:
      initial-backoff: 1s
      multiplier: 2
      max-backoff: 15m

logging:
  level:
    com.opencrm.ai: DEBUG

---
# Local and CI only: the well-known development database password. The default profile has no secret
# defaults, so a deployment without DB_PASS fails at startup instead of trying "postgres" (ADR-016 step 5).
spring:
  config:
    activate:
      on-profile: dev | test
  datasource:
    password: ${DB_PASS:postgres}
