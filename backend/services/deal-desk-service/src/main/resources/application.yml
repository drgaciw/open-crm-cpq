server:
  port: 8085

spring:
  application:
    name: deal-desk-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opencrm}?currentSchema=deal_desk
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: deal_desk
        default_batch_fetch_size: 25
        format_sql: true
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    schemas: deal_desk
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}
          jwk-set-uri: ${JWT_JWK_SET_URI:https://login.microsoftonline.com/common/discovery/v2.0/keys}

security:
  open: ${SECURITY_OPEN:false}

salesforce:
  enabled: ${SALESFORCE_ENABLED:false}
  base-url: ${SALESFORCE_BASE_URL:}
  api-version: ${SALESFORCE_API_VERSION:v60.0}
  auth:
    token-url: ${SALESFORCE_TOKEN_URL:https://login.salesforce.com/services/oauth2/token}
    client-id: ${SALESFORCE_CLIENT_ID:}
    client-secret: ${SALESFORCE_CLIENT_SECRET:}
    username: ${SALESFORCE_USERNAME:}
    password: ${SALESFORCE_PASSWORD:}
    security-token: ${SALESFORCE_SECURITY_TOKEN:}
    grant-type: ${SALESFORCE_GRANT_TYPE:password}
  retry:
    max-attempts: ${SALESFORCE_RETRY_MAX_ATTEMPTS:3}
    backoff-ms: ${SALESFORCE_RETRY_BACKOFF_MS:1000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.opencrm.dealdesk

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.90, 0.95, 0.99
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms

logging:
  level:
    com.opencrm: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

security:
  open: ${SECURITY_OPEN:true}

logging:
  level:
    com.opencrm: DEBUG

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    com.opencrm: INFO
    org.hibernate.SQL: WARN
