spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///opencrm?currentSchema=configuration
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: configuration
  flyway:
    enabled: true
    schemas: configuration
    locations: classpath:db/migration
  cache:
    type: none
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.opencrm: DEBUG
