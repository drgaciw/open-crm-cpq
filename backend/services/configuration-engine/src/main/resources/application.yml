spring:
  application:
    name: configuration-engine
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cpq_configuration}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: configuration-engine
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

grpc:
  client:
    pricing-service:
      address: static://localhost:9090
      negotiationType: plaintext

server:
  port: 8088

services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
    # Thin in-process TTL for configuration rule GET (S2B-9); no Kafka invalidation.
    rules-cache-ttl: ${PRODUCT_RULES_CACHE_TTL:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
