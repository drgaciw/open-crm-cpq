spring:
  # Same Azure auto-configuration excludes as the running producer services (quote/product/pricing):
  # spring-cloud-azure's B2C, token-credential, compatibility-verifier and Event Hubs Kafka OAuth2
  # auto-configurations block local boot on Spring Boot 4 (ADR-018 D1 / ADR-010).
  autoconfigure:
    exclude:
      - com.azure.spring.cloud.autoconfigure.implementation.context.AzureTokenCredentialAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.compatibility.AzureCompatibilityVerifierAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.aadb2c.configuration.AadB2cAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.aadb2c.configuration.AadB2cResourceServerAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.kafka.AzureEventHubsKafkaOAuth2AutoConfiguration
  cloud:
    azure:
      compatibility-verifier:
        enabled: false
  application:
    name: configuration-engine
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opencrm}?currentSchema=${DB_SCHEMA:configuration}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:configuration}
        format_sql: true
  flyway:
    enabled: true
    # Existing standalone deployments must retain DB_NAME and set DB_SCHEMA=public.
    # Refuse to baseline unknown data; preserve an existing Flyway history instead.
    baseline-on-migrate: false
    default-schema: ${DB_SCHEMA:configuration}
    schemas: ${DB_SCHEMA:configuration}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: configuration-engine
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

grpc:
  client:
    pricing-service:
      address: static://localhost:9090
      negotiationType: plaintext

server:
  port: 8088

services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
    # Thin in-process TTL for configuration rule GET (S2B-9); no Kafka invalidation.
    rules-cache-ttl: ${PRODUCT_RULES_CACHE_TTL:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

---
# Local and CI only: the well-known development database password. The default profile has no secret
# defaults, so a deployment without DB_PASSWORD fails at startup instead of trying "postgres" (ADR-016 step 5).
spring:
  config:
    activate:
      on-profile: dev | test
  datasource:
    password: ${DB_PASSWORD:postgres}
