server:
  port: 8087

spring:
  config:
    import: optional:classpath:prompts.yml
  application:
    name: pricing-ai-rules-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opencrm}?currentSchema=pricing_ai_rules
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: pricing_ai_rules
        format_sql: true
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    schemas: pricing_ai_rules
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
  ai:
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY:mock-key}
        endpoint: ${AZURE_OPENAI_ENDPOINT:https://mock-endpoint.openai.azure.com}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_DEPLOYMENT_NAME:gpt-4o}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        pricing.ai.rules.execution: true
      percentiles:
        http.server.requests: 0.5, 0.90, 0.95, 0.99

logging:
  level:
    com.opencrm.pricingairules: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

pricing-ai-rules:
  rules:
    default-rule-set-name: ${PRICING_AI_RULES_DEFAULT_RULE_SET:StandardPricing}
  ai:
    enabled: ${PRICING_AI_RULES_AI_ENABLED:true}
    max-retries: ${PRICING_AI_RULES_AI_MAX_RETRIES:2}

drools:
  ai:
    optimization:
      enabled: ${DROOLS_AI_OPTIMIZATION_ENABLED:false}
      pre-execution: ${DROOLS_AI_OPTIMIZATION_PRE_EXECUTION:false}
    sequential-thinking:
      enabled: ${DROOLS_AI_SEQUENTIAL_THINKING_ENABLED:true}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

security:
  open: true

logging:
  level:
    com.opencrm.pricingairules: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    com.opencrm.pricingairules: INFO
