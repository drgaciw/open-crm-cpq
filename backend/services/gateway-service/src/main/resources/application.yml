server:
  port: 8080

spring:
  application:
    name: gateway-service
  threads:
    virtual:
      enabled: true

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@clientKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:50}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:100}
                redis-rate-limiter.requestedTokens: ${RATE_LIMIT_REQUESTED_TOKENS:1}
          globalcors:
            corsConfigurations:
              '[/**]':
                # Explicit origins only — no *. wildcards. Prefer FRONTEND_URL;
                # set CORS_ALLOWED_ORIGINS (comma-separated) to replace the default list.
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:4200}}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
                # The SPA reads the login hint on a 401 (ADR-016 step 3).
                exposedHeaders: X-OpenCRM-Login
                maxAge: 3600

          routes:
            # CRM Service routes (use direct URI for MVP, lb:// for production with service discovery)
            - id: crm-service
              uri: ${CRM_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/leads/**,/api/v1/deals/**,/api/v1/contacts/**,/api/v1/organizations/**,/api/v1/guided-sessions/**
              filters:
                - CircuitBreaker=name=crmCircuitBreaker,fallbackUri=forward:/fallback/crm

            # Pricing Service routes
            - id: pricing-service
              uri: ${PRICING_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/pricing/**,/api/v1/pricing-customers/**,/api/v1/rule-sets/**,/api/v1/rules/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: pricingCircuitBreaker
                    fallbackUri: forward:/fallback/pricing

            # CPQ gateway aliases delegate pricing commands to the pricing aggregate owner.
            - id: cpq-pricing-service
              uri: ${PRICING_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/cpq/pricing/**,/api/v1/cpq/pricing-customers/**,/api/v1/cpq/rule-sets/**,/api/v1/cpq/rules/**
              filters:
                - RewritePath=/api/v1/cpq/(?<segment>pricing|pricing-customers|rule-sets|rules)(?<remaining>/?.*), /api/v1/$\{segment}$\{remaining}
                - name: CircuitBreaker
                  args:
                    name: pricingCircuitBreaker
                    fallbackUri: forward:/fallback/pricing

            # Price Book Service routes
            - id: pricebook-service
              uri: ${PRICEBOOK_SERVICE_URI:http://localhost:8089}
              predicates:
                - Path=/api/v1/price-books/**
              filters:
                - CircuitBreaker=name=pricebookCircuitBreaker,fallbackUri=forward:/fallback/pricebook

            # CPQ gateway alias delegates price book commands to the price book aggregate owner.
            - id: cpq-pricebook-service
              uri: ${PRICEBOOK_SERVICE_URI:http://localhost:8089}
              predicates:
                - Path=/api/v1/cpq/price-books/**
              filters:
                - RewritePath=/api/v1/cpq/(?<segment>price-books)(?<remaining>/?.*), /api/v1/$\{segment}$\{remaining}
                - CircuitBreaker=name=pricebookCircuitBreaker,fallbackUri=forward:/fallback/pricebook

            # S2B-11: agent validate must precede configuration/** (product CRUD) or SCG
            # first-match keeps agents on product List<String>. Route + rewrite only.
            # Rewrites to CE's public evaluate; CE's internal path refuses user tokens (ADR-016 step 2).
            - id: configuration-validate
              uri: ${CONFIGURATION_ENGINE_URI:http://localhost:8088}
              predicates:
                - Method=POST
                - Path=/api/v1/configuration/validate
              filters:
                - RewritePath=/api/v1/configuration/validate, /api/v1/configurations/evaluate
                - CircuitBreaker=name=configurationCircuitBreaker,fallbackUri=forward:/fallback/configuration

            - id: cpq-configuration-validate
              uri: ${CONFIGURATION_ENGINE_URI:http://localhost:8088}
              predicates:
                - Method=POST
                - Path=/api/v1/cpq/configuration/validate
              filters:
                - RewritePath=/api/v1/cpq/configuration/validate, /api/v1/configurations/evaluate
                - CircuitBreaker=name=configurationCircuitBreaker,fallbackUri=forward:/fallback/configuration

            # Product Service routes (rules CRUD under configuration/** stays here)
            - id: product-service
              uri: ${PRODUCT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/products/**,/api/v1/product-bundles/**,/api/v1/product-options/**,/api/v1/product-attributes/**,/api/v1/configuration/**
              filters:
                - CircuitBreaker=name=productCircuitBreaker,fallbackUri=forward:/fallback/product

            # CPQ gateway aliases delegate product, bundle, option, attribute, and configuration
            # commands to the product aggregate owner.
            - id: cpq-product-service
              uri: ${PRODUCT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/cpq/products/**,/api/v1/cpq/product-bundles/**,/api/v1/cpq/product-options/**,/api/v1/cpq/product-attributes/**,/api/v1/cpq/configuration/**
              filters:
                - RewritePath=/api/v1/cpq/(?<segment>products|product-bundles|product-options|product-attributes|configuration)(?<remaining>/?.*), /api/v1/$\{segment}$\{remaining}
                - CircuitBreaker=name=productCircuitBreaker,fallbackUri=forward:/fallback/product

            # Quote Service routes
            - id: quote-service
              uri: ${QUOTE_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/quotes/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: quoteCircuitBreaker
                    fallbackUri: forward:/fallback/quote

            # CPQ gateway alias delegates quote and approval commands to the quote aggregate owner.
            - id: cpq-quote-service
              uri: ${QUOTE_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/cpq/quotes/**
              filters:
                - RewritePath=/api/v1/cpq/(?<segment>quotes)(?<remaining>/?.*), /api/v1/$\{segment}$\{remaining}
                - name: CircuitBreaker
                  args:
                    name: quoteCircuitBreaker
                    fallbackUri: forward:/fallback/quote

            # Configuration Engine routes
            - id: configuration-engine
              uri: ${CONFIGURATION_ENGINE_URI:http://localhost:8088}
              predicates:
                - Path=/api/v1/configurations/**
              filters:
                - CircuitBreaker=name=configurationCircuitBreaker,fallbackUri=forward:/fallback/configuration

            # CPQ gateway alias delegates configuration session commands to the configuration owner.
            - id: cpq-configuration-engine
              uri: ${CONFIGURATION_ENGINE_URI:http://localhost:8088}
              predicates:
                - Path=/api/v1/cpq/configurations/**
              filters:
                - RewritePath=/api/v1/cpq/(?<segment>configurations)(?<remaining>/?.*), /api/v1/$\{segment}$\{remaining}
                - CircuitBreaker=name=configurationCircuitBreaker,fallbackUri=forward:/fallback/configuration

            # Approval Routing routes
            - id: approval-routing
              uri: ${APPROVAL_ROUTING_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/approvals/**
              filters:
                - CircuitBreaker=name=approvalCircuitBreaker,fallbackUri=forward:/fallback/approval

            # CPQ gateway alias delegates approval workflow commands to the approval owner.
            - id: cpq-approval-routing
              uri: ${APPROVAL_ROUTING_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/cpq/approvals/**
              filters:
                - RewritePath=/api/v1/cpq/(?<segment>approvals)(?<remaining>/?.*), /api/v1/$\{segment}$\{remaining}
                - CircuitBreaker=name=approvalCircuitBreaker,fallbackUri=forward:/fallback/approval

            # Document Generation routes
            - id: document-generation
              uri: ${DOCUMENT_GENERATION_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/documents/**
              filters:
                - CircuitBreaker=name=documentCircuitBreaker,fallbackUri=forward:/fallback/document

            # CPQ gateway alias delegates document commands to the document generation owner.
            - id: cpq-document-generation
              uri: ${DOCUMENT_GENERATION_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/cpq/documents/**
              filters:
                - RewritePath=/api/v1/cpq/(?<segment>documents)(?<remaining>/?.*), /api/v1/$\{segment}$\{remaining}
                - CircuitBreaker=name=documentCircuitBreaker,fallbackUri=forward:/fallback/document

            # Contract/Asset Management routes
            - id: contract-asset-management
              uri: ${CONTRACT_ASSET_MANAGEMENT_URI:http://localhost:8087}
              predicates:
                - Path=/api/v1/subscriptions/**,/api/v1/assets/**
              filters:
                - CircuitBreaker=name=contractCircuitBreaker,fallbackUri=forward:/fallback/contract

            # CPQ gateway alias delegates subscription commands to the contract/asset owner.
            - id: cpq-contract-asset-management
              uri: ${CONTRACT_ASSET_MANAGEMENT_URI:http://localhost:8087}
              predicates:
                - Path=/api/v1/cpq/subscriptions/**
              filters:
                - RewritePath=/api/v1/cpq/(?<segment>subscriptions)(?<remaining>/?.*), /api/v1/$\{segment}$\{remaining}
                - CircuitBreaker=name=contractCircuitBreaker,fallbackUri=forward:/fallback/contract

            # ERP adapter placeholder (S2A-7): agent-contract paths reserved until erp-adapter-service exists
            - id: erp-stub
              uri: forward:/fallback/erp/unavailable
              predicates:
                - Path=/api/v1/erp/**

            # Communication Service routes
            - id: communication-service
              uri: ${COMMUNICATION_SERVICE_URI:lb://communication-service}
              predicates:
                - Path=/api/v1/emails/**,/api/v1/calls/**,/api/v1/templates/**
              filters:
                - CircuitBreaker=name=communicationCircuitBreaker,fallbackUri=forward:/fallback/communication

            # AI Service routes
            - id: ai-service
              uri: ${AI_SERVICE_URI:http://localhost:8090}
              predicates:
                - Path=/api/v1/ai/**,/api/v1/copilot/**
              filters:
                - CircuitBreaker=name=aiCircuitBreaker,fallbackUri=forward:/fallback/ai

  # Redis for rate limiting and, through Spring Session, the BFF sessions (ADR-016 step 3)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}


# Identity (ADR-016). Nothing here has a default value on purpose; set these in the environment:
#   OPENCRM_SECURITY_JWT_ISSUERURI   tenant issuer https://login.microsoftonline.com/<tenant-id>/v2.0 (bearer lane and login)
#   OPENCRM_SECURITY_JWT_AUDIENCES   the API's client id (v2.0 tokens) and api://opencrm-api
#   OPENCRM_GATEWAY_LOGIN_CLIENTID   the gateway's Entra app registration; unset = no browser login, bearer lane only
#   AZURE_FEDERATED_TOKEN_FILE       injected by AKS workload identity: the gateway's client assertion
#   OPENCRM_ENV=prod                 production marker: refuses dev mode, a missing login and client secrets

security:
  csrf:
    # Same explicit allow-list as CORS (no *. patterns; filter rejects wildcards at bind).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:4200}}

# Resilience4j Circuit Breaker
resilience4j:
  timelimiter:
    # Cloud's reactive factory resolves named configs by breaker ID. Keep its
    # configuration lookup and the TimeLimiter instances on the same budgets.
    configs:
      # Quote's pricing client allows 5s connect + 30s read. Leave another 10s
      # for service-token acquisition/local orchestration instead of the library's
      # 1s default, which times out successful cold rule compilation.
      quoteCircuitBreaker:
        timeoutDuration: ${QUOTE_GATEWAY_TIMEOUT:45s}
      # Direct pricing requests have no quote-service hop, but still need the
      # same bounded computation budget as quote's outbound pricing request.
      pricingCircuitBreaker:
        timeoutDuration: ${PRICING_GATEWAY_TIMEOUT:35s}
    instances:
      quoteCircuitBreaker:
        baseConfig: quoteCircuitBreaker
      pricingCircuitBreaker:
        baseConfig: pricingCircuitBreaker
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      crmCircuitBreaker:
        baseConfig: default
      pricingCircuitBreaker:
        baseConfig: default
      pricebookCircuitBreaker:
        baseConfig: default
      productCircuitBreaker:
        baseConfig: default
      quoteCircuitBreaker:
        baseConfig: default
      communicationCircuitBreaker:
        baseConfig: default
      aiCircuitBreaker:
        baseConfig: default
      configurationCircuitBreaker:
        baseConfig: default
      approvalCircuitBreaker:
        baseConfig: default
      documentCircuitBreaker:
        baseConfig: default
      contractCircuitBreaker:
        baseConfig: default

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      show-details: when_authorized
    # Actuator gateway endpoint (not spring.cloud.gateway.server.webflux.*)
    # Boot 3.4+/4: access replaces enabled; read-only allows route inspection only.
    gateway:
      access: read-only
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.90, 0.95, 0.99
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms

# Logging
logging:
  level:
    org.springframework.cloud.gateway: INFO
    # DEBUG would log session and token handling details (ADR-016 step 3).
    org.springframework.security: INFO
    com.opencrm: DEBUG

---
