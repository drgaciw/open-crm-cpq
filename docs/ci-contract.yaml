# Machine-readable CI contract — Jenkins primary CI; GHA manual fallback with a nightly schedule,
# one pull-request gate and one post-merge gate on main.
# Human docs: docs/ci-jenkins-cutover.md, infra/jenkins/README.md, docs/adr/ADR-003-ci-llm-integration.md
# When changing Jenkinsfile, .github/workflows/*, or scripts/ci/*, update this file in the same PR.

schema_version: "1"
repository: open-crm-cpq
last_reviewed: "2026-11-11"

# JDK2 toolchain pins (GHA + Jenkins Maven/Node). Jenkins controller image is 2.580.2-lts-jdk25.
toolchain:
  java_version: "25"
  java_distribution: temurin
  node_version: "24.22.3"
  jenkins_war_image: jenkins/jenkins:2.580.2-lts-jdk25
  jenkins_maven_java_home: /opt/java/temurin-25
  service_runtime_image: eclipse-temurin:25-jre-alpine

execution:
  primary: jenkins
  fallback: github_actions_manual
  pr_gate: github_actions_pr_check
  main_gate: github_actions_main_verify
  nightly: github_actions_ci_schedule
  github_status_context: jenkins/opencrm-cpq-ci

ssot:
  entrypoint: scripts/ci/run-core.sh
  description: All build/test commands; Jenkins runs on PR/push; GHA when manually dispatched.
  failure_reporting: >-
    GHA Maven jobs (ci.yml shared-libraries, backend-unit, backend-integration; pr-check.yml;
    main-verify.yml) run python3 scripts/ci/report-test-failures.py with if: failure(). It only prints
    failing JUnit cases as annotations, so a failure can be named from the run summary or the
    check-runs API without the job log; it never changes the job result.

scripts_ci:
  stages:
    - id: toolchain
      script: scripts/ci/toolchain-check.sh
      run_core_arg: toolchain
      gha_job: null
      jenkins_stage: Toolchain
      blocking: true
      notes: >-
        After tool versions, runs python3 .cursor/skills/ci-contract-drift-check/scripts/verify-drift.py
        as a blocking non-AI gate. Jenkins AI Assist drift_sentinel remains advisory when AI_CI_ENABLED=true.
    - id: shared-libraries
      script: scripts/ci/shared-libraries.sh
      run_core_arg: shared-libraries
      gha_job: shared-libraries
      jenkins_stage: Shared Libraries
      blocking: true
    - id: backend-unit
      script: scripts/ci/backend-unit.sh
      run_core_arg: backend-unit
      gha_job: backend-unit
      jenkins_stage: Backend Unit
      jenkins_parallel_group: Parallel — Fast checks
      blocking: true
      notes: "Maven verify -Punit-tests over the whole backend reactor (excludes integration- and docker-tagged tests); fails if Testcontainers starts a container, so the stage stays Docker-free"
    - id: cpq-beta-python
      script: scripts/ci/cpq-beta-python.sh
      run_core_arg: cpq-beta-python
      gha_job: cpq-beta-python
      jenkins_stage: CPQ Beta Python
      jenkins_parallel_group: Parallel — Fast checks
      blocking: true
    - id: frontend
      script: scripts/ci/frontend.sh
      run_core_arg: frontend
      gha_job: frontend
      jenkins_stage: Frontend
      jenkins_parallel_group: Parallel — Fast checks
      blocking: true
    - id: backend-integration
      script: scripts/ci/backend-integration.sh
      run_core_arg: backend-integration
      gha_job: backend-integration
      jenkins_stage: Backend Integration
      blocking: true
      requires_docker: true
    - id: security-audit
      script: scripts/ci/security-audit.sh
      run_core_arg: security-audit
      gha_job: security-audit
      jenkins_stage: Security Audit
      blocking: false
      notes: Jenkins uses catchError(UNSTABLE); GHA job has no needs — runs independently

ai_assist:
  platform: jenkins_only
  enabled_when: AI_CI_ENABLED=true
  blocking_when: AI_CI_BLOCKING=true
  jenkins_stage: AI Assist
  scripts_dir: infra/jenkins/ai-assist
  stages:
    - code_review
    - test_suggestions
    - log_analysis
    - drift_check
    - security_triage
  post_failure_only:
    - log_analysis
  post_security_audit:
    - security_triage
  llm_env:
    - LLM_PROVIDER
    - LLM_API_KEY
    - LLM_ENDPOINT
    - LLM_MODEL
    - LLM_TIMEOUT_MS
  credential_id: ai-api-key
  not_used_by:
    - github_actions
    - ai-service-sidecar

github_actions:
  workflow: .github/workflows/ci.yml
  role: manual_fallback_and_nightly
  trigger:
    workflow_dispatch: true
    schedule_cron: "17 2 * * *"   # nightly full matrix on main (ADR-003 section 8)
    push_branches: []
    pull_request_branches: []
  concurrency: null
  jobs:
    shared-libraries:
      needs: []
      run: bash scripts/ci/run-core.sh shared-libraries
      notes: >-
        actions/setup-java temurin 25. Also runs python3
        .cursor/skills/ci-contract-drift-check/scripts/verify-drift.py
        (manual fallback mirror of Jenkins toolchain gate; no AI assist).
    backend-unit:
      needs: []
      run: bash scripts/ci/run-core.sh backend-unit
      notes: actions/setup-java temurin 25
    backend-integration:
      needs: [shared-libraries, backend-unit]
      run: bash scripts/ci/run-core.sh backend-integration
      notes: actions/setup-java temurin 25
    cpq-beta-python:
      needs: []
      run: bash scripts/ci/run-core.sh cpq-beta-python
    frontend:
      needs: []
      run: bash scripts/ci/run-core.sh frontend
      notes: actions/setup-node 24.22.3 LTS (Angular 22 accepts ^24.15.0)
    security-audit:
      needs: []
      run: bash scripts/ci/run-core.sh security-audit
      notes: actions/setup-node 24.22.3 LTS + actions/setup-java temurin 25
  needs_graph:
    # Integration gates only on shared-libraries + backend-unit (not frontend or cpq-beta)
    backend-integration:
      - shared-libraries
      - backend-unit

# Automatic GHA workflows: this pull-request gate (ADR-003 section 7, 2026-09-28) and the post-merge
# gate below (section 8, 2026-10-16). ci.yml above has no push/pull_request trigger.
github_pr_gate:
  workflow: .github/workflows/pr-check.yml
  role: pull_request_gate
  trigger:
    pull_request_branches: [main]
  job: backend-unit
  job_name: Backend Unit (PR gate)
  runs:
    - python3 .cursor/skills/ci-contract-drift-check/scripts/verify-drift.py
    - bash scripts/ci/run-core.sh backend-unit
  # Second job (ADR-003 section 7, amendment 2026-11-10): the frontend stage, unchanged.
  frontend_job: frontend
  frontend_job_name: Frontend (PR gate)
  frontend_runs:
    - bash scripts/ci/run-core.sh frontend
  ai_assist: false
  required_check_possible: false
  notes: >-
    Same Docker-free stage as Jenkins Backend Unit, so the security-baseline and event-contract
    fitness tests run on every pull request. Frontend job uses actions/setup-node 24.22.3 LTS.
    The repository is private and its plan offers no
    branch protection, so merging on a green check is procedural (gh pr checks --watch).

# Post-merge gate on main (ADR-003 section 8, 2026-10-16). Verifies the combined head after merges.
github_main_gate:
  workflow: .github/workflows/main-verify.yml
  role: post_merge_gate
  trigger:
    push_branches: [main]
    workflow_dispatch: true
  concurrency: main-verify-${{ github.ref }} (cancel-in-progress per ref; non-main dispatches cannot cancel main)
  job: backend-unit
  job_name: Backend Unit (main)
  runs:
    - python3 .cursor/skills/ci-contract-drift-check/scripts/verify-drift.py
    - bash scripts/ci/run-core.sh backend-unit
  ai_assist: false
  notes: >-
    Same Docker-free stage as the pull-request gate. Must trigger on push to main only, never on
    pull_request. A red run means the merge burst it covered broke main: fix or revert next.
  # Amendment 2026-11-10: main-verify.yml and the nightly ci.yml each end with a report job that
  # opens or closes one issue labelled main-red. It is the only job with issues: write.
  report_script: scripts/ci/report-main-status.sh
  report_label: main-red
  report_workflows:
    - .github/workflows/main-verify.yml
    - .github/workflows/ci.yml

jenkins:
  file: Jenkinsfile
  job: opencrm-cpq
  job_type: multibranch
  agent: any
  github_status_context: jenkins/opencrm-cpq-ci
  toolchain_note: >-
    Jenkins-only; no GHA equivalent job. Controller WAR is 2.580.2-lts-jdk25;
    Maven JAVA_HOME is Temurin 25; Node 24.22.3 LTS. Do not move Jenkins core to JDK 27.
  stages_ordered:
    - name: Checkout
      type: scm
    - name: Toolchain
      run: bash scripts/ci/run-core.sh toolchain
    - name: Shared Libraries
      run: bash scripts/ci/run-core.sh shared-libraries
    - name: Parallel — Fast checks
      parallel:
        - Backend Unit
        - CPQ Beta Python
        - Frontend
    - name: Backend Integration
      run: bash scripts/ci/run-core.sh backend-integration
      parity_note: Does not wait on frontend or cpq-beta (matches GHA needs)
    - name: AI Assist
      when: AI_CI_ENABLED=true
      jenkins_only: true
    - name: Security Audit
      run: bash scripts/ci/run-core.sh security-audit
      non_blocking: true
  post:
    always:
      - archiveArtifacts ci-reports/**/*.md
    failure:
      - ai log_analysis when AI_CI_ENABLED=true

drift_prevention:
  rules:
    - Change scripts/ci stage scripts and run-core.sh case arms together.
    - Update this file when adding/removing Jenkins stages or GHA manual jobs.
    - Do not re-enable push/pull_request triggers on ci.yml without updating docs/ci-jenkins-cutover.md.
    - ci.yml on.schedule cron must match github_actions.trigger.schedule_cron.
    - The automatic GHA workflows are pr-check.yml (github_pr_gate, pull_request only), main-verify.yml (github_main_gate, push to main only) and the nightly schedule on ci.yml; the two gates must call run-core.sh backend-unit and verify-drift.py, and none may reference ai-assist.
    - backend-integration must depend only on shared-libraries and backend-unit in GHA needs (manual fallback).
    - Do not point ai-assist LLM_ENDPOINT at ai-service:8086 (product AgentRouter, not chat API).
    - ai-assist stages must not be added to .github/workflows/ci.yml without ADR amendment.
    - Jenkins must publish GitHub status context jenkins/opencrm-cpq-ci when scm-token is set.
    - Toolchain (Jenkins) and GHA shared-libraries must run verify-drift.py as a blocking non-AI gate.
  verify_commands:
    - bash scripts/ci/run-core.sh toolchain
    - rg -l "run-core.sh" Jenkinsfile .github/workflows/ci.yml
    - python .cursor/skills/ci-contract-drift-check/scripts/verify-drift.py
