        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/ContinuationBadRequest"
        "409":
          $ref: "#/components/responses/ContinuationConflict"
        "422":
          $ref: "#/components/responses/ContinuationValidationFailure"

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        Browser session at the gateway (ADR-016). Unsafe methods from the
        browser also send the CSRF header X-XSRF-TOKEN, echoing the XSRF-TOKEN
        cookie (ADR-004). The cookie name SESSION is the gateway session
        cookie; clients do not forge it.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Agent and service lane. No CSRF header.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required for every new mutation in this draft contract. Reuse on a
        replay; reject a different request body for the same key. Stored as
        requestIdentifier when the body omits one. Unique per tenant. The
        pre-existing quote-continuation endpoints keep their current contract.
      schema:
        type: string
        maxLength: 200
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 20}
    ContractId:
      name: contractId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AmendmentId:
      name: amendmentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    LifecycleChangeId:
      name: lifecycleChangeId
      in: path
      required: true
      schema: {type: string, format: uuid}

  headers:
    IdempotentReplayed:
      description: true when this call returned the resource from an earlier identical command.
      schema: {type: boolean}

  responses:
    Unauthorized:
      description: Missing or rejected gateway authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: No resource for this id in the caller tenant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            errorCode: NOT_FOUND
            message: Resource not found
            timestamp: "2026-11-01T12:00:00Z"
    Conflict:
      description: |
        VERSION_CONFLICT when `version` is stale. IDEMPOTENCY_CONFLICT when
        the same key is reused with a different body. IMMUTABLE_EXECUTED when
        a command would change an executed document (AC-S3-5); the service
        also appends an audit event. ILLEGAL_TRANSITION when the state machine
        forbids the command.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ContinuationBadRequest:
      description: |
        Existing continuation service validation returns SUBSCRIPTION_CONTINUATION_INVALID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExistingContinuationErrorResponse"
    ContinuationValidationFailure:
      description: |
        Existing quote-service bean validation returns 422 VALIDATION_ERROR;
        constraint validation returns 422 CONSTRAINT_VIOLATION.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExistingContinuationErrorResponse"
    ContinuationConflict:
      description: Existing planner domain rejection, SUBSCRIPTION_CONTINUATION_INVALID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExistingContinuationErrorResponse"
    Unprocessable:
      description: |
        Domain rejection with the resource left unchanged when it already
        exists. errorCode is one of VALIDATION_REJECTED,
        ACTION_NOT_SUPPORTED_IN_SLICE, SIGNATURE_NOT_SUPPORTED_IN_SLICE, or
        INTENT_NOT_SUPPORTED_IN_SLICE. VALIDATION_REJECTED includes violations
        with the rule id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotentReplayLifecycleChange:
      description: Existing lifecycle change for this request identifier.
      headers:
        Idempotent-Replayed:
          $ref: "#/components/headers/IdempotentReplayed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LifecycleChangeResponse"
    IdempotentReplayAmendment:
      description: Existing amendment for this lifecycleChangeId.
      headers:
        Idempotent-Replayed:
          $ref: "#/components/headers/IdempotentReplayed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AmendmentResponse"

  schemas:
    Money:
      type: string
      description: Decimal numeric(19,4), transported as a string.
      pattern: '^-?\d{1,15}(\.\d{1,4})?$'
      example: "15.0000"
    Sha256:
      type: string
      description: Lowercase hex SHA-256.
      pattern: '^[a-f0-9]{64}$'
    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      example: USD

    PageInfo:
      type: object
      required: [page, size, totalElements, totalPages, hasNext, hasPrevious]
      properties:
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
        hasNext: {type: boolean}
        hasPrevious: {type: boolean}

    ApiEnvelope:
      type: object
      required: [success, timestamp]
      description: |
        Platform `ApiResponse` envelope. `violations` is additive for rule
        failures so clients can read the rule id without parsing `errors`.
      properties:
        success: {type: boolean}
        message: {type: string, nullable: true}
        errorCode: {type: string, nullable: true}
        traceId: {type: string, nullable: true}
        errors:
          type: array
          nullable: true
          items: {type: string}
        violations:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/RuleViolation"
        pagination:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PageInfo"
        timestamp: {type: string, format: date-time}

    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, errorCode, message]
          properties:
            success: {type: boolean, enum: [false]}
            errorCode:
              $ref: "#/components/schemas/ErrorCode"

    ExistingContinuationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, errorCode, message]
          properties:
            success: {type: boolean, enum: [false]}
            errorCode:
              type: string
              description: |
                Existing quote-service codes are retained. Planner and service
                domain failures use SUBSCRIPTION_CONTINUATION_INVALID; bean
                validation uses VALIDATION_ERROR. Other existing service codes
                remain possible and are not restricted to the new slice enum.
    ErrorCode:
      type: string
      description: |
        Codes named by S3 or S5 are SIGNATURE_NOT_SUPPORTED_IN_SLICE and
        ACTION_NOT_SUPPORTED_IN_SLICE. The others are the proposal's names for
        the acceptance outcomes those stories describe.
      enum:
        - VALIDATION_REJECTED
        - ACTION_NOT_SUPPORTED_IN_SLICE
        - SIGNATURE_NOT_SUPPORTED_IN_SLICE
        - INTENT_NOT_SUPPORTED_IN_SLICE
        - IMMUTABLE_EXECUTED
        - IDEMPOTENCY_CONFLICT
        - VERSION_CONFLICT
        - ILLEGAL_TRANSITION
        - NOT_FOUND
        - UNAUTHORIZED

    RuleId:
      type: string
      description: Mid-term policy rule V1-V14. Renewal rules RN1-RN5 are not evaluated in this slice.
      enum: [V1, V2, V3, V4, V5, V6, V7, V8, V9, V10, V11, V12, V13, V14]

    RuleViolation:
      type: object
      required: [ruleId, message]
      properties:
        ruleId:
          $ref: "#/components/schemas/RuleId"
        message: {type: string}
        field: {type: string, nullable: true}

    LifecycleIntent:
      type: string
      description: Research 7.2. Create accepts AMEND only in this slice.
      enum: [RENEW, AMEND, CANCEL, RESTRUCTURE, TRANSFER, SUSPEND, RESUME, TRUE_UP, CONVERT]

    InitiationTrigger:
      type: string
      description: Create accepts MANUAL and API in this slice. The others are renewal or later triggers.
      enum: [MANUAL, LEAD_TIME, TERM_END_AUTO, THRESHOLD, TRUE_UP_CYCLE, END_OF_LIFE, API]

    OutputMode:
      type: string
      enum: [QUOTE, DIRECT_ORDER]

    LifecycleChangeStatus:
      type: string
      description: |
        Research 7.3, plus WITHDRAWN for the seller withdraw command.
        First-slice transitions: DRAFT, PRICED (after :price), IN_APPROVAL
        (after :submit), WITHDRAWN. APPROVED and later follow the amendment
        document; this proposal does not make quote-service the legal record.
      enum:
        - DRAFT
        - PRICED
        - IN_APPROVAL
        - APPROVED
        - PRESENTED
        - ACCEPTED
        - REJECTED
        - EXPIRED
        - SUPERSEDED
        - ORDERED
        - APPLIED
        - REVERTED
        - WITHDRAWN

    ActionCode:
      type: string
      description: |
        Slice stores ADD, UPDATE and REMOVE. SWAP, UPGRADE and DOWNGRADE may
        be stored and fail at lifecycle submit. Other values are rejected at
        create.
      enum:
        - ADD
        - UPDATE
        - REMOVE
        - NO_CHANGE
        - RENEW
        - UPGRADE
        - DOWNGRADE
        - SWAP
        - CONVERT_METRIC
        - SUSPEND
        - RESUME
        - TERMINATE

    QuantitySemantics:
      type: string
      description: First slice accepts DELTA and ABSOLUTE. REPLACE is a later value and is not in this enum yet.
      enum: [DELTA, ABSOLUTE]

    BusinessCategory:
      type: string
      enum:
        - INITIAL_SALE
        - RENEWAL
        - UPSELL
        - DOWNSELL
        - CROSS_SELL
        - UPGRADE
        - DOWNGRADE
        - SWAP
        - CANCELLATION
        - TERMS_AND_CONDITIONS
        - TRANSFER
        - TRUE_UP

    ApplyTargetType:
      type: string
      enum: [SUBSCRIPTION, ENTITLEMENT, ONE_TIME, NONE]

    ChargeType:
      type: string
      enum: [RECURRING, ONE_TIME, USAGE]

    PriceAsOf:
      type: string
      description: Default on price is EFFECTIVE_DATE when the line omits it.
      enum: [ACTION_DATE, EFFECTIVE_DATE, LINE_START]

    AmendMode:
      type: string
      enum: [RETAIN_CONTRACTED, LIST, OVERRIDE]

    ProrationMethod:
      type: string
      enum: [DAILY, MONTH_DAY, NONE, NEXT_CYCLE]

    PolicySlot:
      type: string
      description: First slice writes AMENDMENT. Other slots belong to later policies.
      enum: [AMENDMENT, RENEWAL, PRICE_LOCK, TRUE_UP, MAINTENANCE, CONVERSION]

    AmendmentStatus:
      type: string
      description: |
        Spec section 3, single status column. applyStatus does not exist.
        First-slice commands use DRAFT, IN_REVIEW, APPROVED, EXECUTED,
        REJECTED and WITHDRAWN. APPLIED, PARTIALLY_APPLIED and APPLY_BLOCKED
        are reserved for S4. OUT_FOR_SIGNATURE, EXPIRED, SUPERSEDED and VOID
        are reserved for later signature, expiry, restatement and void.
      enum:
        - DRAFT
        - IN_REVIEW
        - APPROVED
        - OUT_FOR_SIGNATURE
        - EXECUTED
        - APPLIED
        - PARTIALLY_APPLIED
        - APPLY_BLOCKED
        - REJECTED
        - WITHDRAWN
        - EXPIRED
        - SUPERSEDED
        - VOID

    DocumentKind:
      type: string
      description: Server-derived from intent in this slice (AMEND becomes AMENDMENT). Client override is later.
      enum:
        - ORIGINAL
        - AMENDMENT
        - RENEWAL
        - AMENDED_AND_RESTATED
        - TRUE_UP_NOTICE
        - TERMINATION
        - RESTRUCTURE
        - BACKFILLED

    SignaturePolicy:
      type: string
      description: |
        EXECUTED in this slice: NOT_REQUIRED and NOTICE_ONLY auto-execute from
        approval; CLICK_THROUGH executes on :accept. WET and E_SIGN can be
        stored and cannot be sent for signature.
      enum: [WET, E_SIGN, CLICK_THROUGH, NOTICE_ONLY, NOT_REQUIRED]

    TermModel:
      type: string
      enum: [TERMED, EVERGREEN, PERPETUAL]

    ContractStatus:
      type: string
      enum: [ACTIVE, EXPIRED, TERMINATED]

    RevisionCloseStatus:
      type: string
      enum: [OPEN, SUPERSEDED, EXECUTED, REJECTED, WITHDRAWN, EXPIRED]

    UnitStatus:
      type: string
      enum: [PENDING, APPLIED, BLOCKED]

    EvidenceClass:
      type: string
      enum: [STANDARD, LEGACY]

    ActorType:
      type: string
      enum: [USER, SYSTEM, SERVICE]

    EventType:
      type: string
      description: |
        Values written to the document event log. Bus payload field names are
        S6 (DRG-584), not this HTTP contract. AMENDMENT_SUPERSEDED is a
        Proposed local-log name for a pre-execution supersede (DRG-616). It
        is not an accepted bus schema, not a schema-registry entry, and not
        an S6 contract test. S6 is not authorized. Payload, topic, and outbox
        registration are not chosen here.
      enum:
        - AMENDMENT_DRAFTED
        - AMENDMENT_SUBMITTED
        - AMENDMENT_APPROVED
        - AMENDMENT_REJECTED
        - AMENDMENT_SENT_FOR_SIGNATURE
        - AMENDMENT_EXECUTED
        - AMENDMENT_UNIT_APPLIED
        - AMENDMENT_APPLIED
        - AMENDMENT_APPLY_BLOCKED
        - AMENDMENT_WITHDRAWN
        - AMENDMENT_SUPERSEDED
        - AMENDMENT_VOIDED
        - VALIDATION_REJECTED

    CreateLifecycleChangeRequest:
      type: object
      required:
        - intent
        - initiationTrigger
        - actionDate
        - contractEffectiveDate
        - contractId
        - currencyCode
        - lines
      properties:
        intent:
          type: string
          enum: [AMEND]
        initiationTrigger:
          type: string
          enum: [MANUAL, API]
        requestIdentifier: {type: string, maxLength: 200, nullable: true}
        actionDate: {type: string, format: date}
        contractEffectiveDate: {type: string, format: date}
        serviceActivationDate: {type: string, format: date, nullable: true}
        customerAcceptanceDate: {type: string, format: date, nullable: true}
        backdatingReasonCode:
          type: string
          nullable: true
          description: Required when contractEffectiveDate is before actionDate (V6).
        contractId: {type: string, format: uuid}
        currencyCode:
          $ref: "#/components/schemas/CurrencyCode"
        outputMode:
          allOf:
            - $ref: "#/components/schemas/OutputMode"
          default: QUOTE
        dryRun:
          type: boolean
          default: false
          description: A dry run is not persisted and has no amendment document.
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChangeLineWrite"

    ChangeLineWrite:
      type: object
      required:
        - actionCode
        - quantitySemantics
        - startQty
        - deltaQty
        - endQty
        - effectiveFrom
      properties:
        actionCode:
          type: string
          enum: [ADD, UPDATE, REMOVE, SWAP, UPGRADE, DOWNGRADE]
        quantitySemantics:
          $ref: "#/components/schemas/QuantitySemantics"
        businessCategory:
          allOf:
            - $ref: "#/components/schemas/BusinessCategory"
          description: |
            Optional. When omitted the server sets UPSELL for ADD and for
            UPDATE with a positive delta, DOWNSELL for UPDATE with a negative
            delta, and CANCELLATION for REMOVE. This default is a proposal.
        targetSubscriptionId:
          type: string
          format: uuid
          nullable: true
          description: Required for UPDATE and REMOVE. Optional for ADD of a new subscription on the contract.
        sourceAcceptedLineUuid:
          type: string
          nullable: true
          description: Required for UPDATE and REMOVE. Must be ACCEPTED_PRICED (V4).
        observedCommercialRevision:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Required when targetSubscriptionId is set (V3).
        startQty:
          $ref: "#/components/schemas/Money"
        deltaQty:
          $ref: "#/components/schemas/Money"
        endQty:
          $ref: "#/components/schemas/Money"
        metric: {type: string, nullable: true}
        effectiveFrom: {type: string, format: date}
        effectiveTo:
          type: string
          format: date
          nullable: true
          description: Required for a termed contract. The amendment policy co-terms this to the contract end.
        productExternalId:
          type: string
          nullable: true
          description: Required on ADD before price. On UPDATE and REMOVE the server pins the source product if omitted.
        chargeType:
          allOf:
            - $ref: "#/components/schemas/ChargeType"
          default: RECURRING

    ReviseLifecycleChangeRequest:
      type: object
      required: [version, lines]
      properties:
        version: {type: integer, minimum: 0}
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChangeLineWrite"
        actionDate: {type: string, format: date}
        contractEffectiveDate: {type: string, format: date}
        backdatingReasonCode: {type: string, nullable: true}

    PriceLifecycleChangeRequest:
      type: object
      required: [version]
      properties:
        version: {type: integer, minimum: 0}
        lines:
          type: array
          description: Optional per-line mode. Omitted lines use RETAIN_CONTRACTED, DAILY, EFFECTIVE_DATE, policy slot AMENDMENT.
          items:
            $ref: "#/components/schemas/PriceLineRequest"

    PriceLineRequest:
      type: object
      required: [lineId]
      properties:
        lineId: {type: string, format: uuid}
        amendMode:
          $ref: "#/components/schemas/AmendMode"
        prorationMethod:
          $ref: "#/components/schemas/ProrationMethod"
        priceAsOf:
          $ref: "#/components/schemas/PriceAsOf"
        policySlot:
          type: string
          enum: [AMENDMENT]
        override:
          $ref: "#/components/schemas/PriceOverrideWrite"

    PriceOverrideWrite:
      type: object
      required: [value, reasonCode]
      description: Actor is taken from the principal, not from this body (AC-S5-4, V14).
      properties:
        value:
          $ref: "#/components/schemas/Money"
        reasonCode: {type: string, minLength: 1}

    VersionedCommand:
      type: object
      required: [version]
      properties:
        version: {type: integer, minimum: 0}

    OpenAmendmentRevisionRequest:
      description: |
        Proposal only. Not accepted. Expected document row version, the
        superseding LifecycleChange revision, and commercial lines with no
        prices and no pins. See openAmendmentRevision.
      allOf:
        - $ref: "#/components/schemas/VersionedCommand"
        - type: object
          required: [lifecycleChangeRevision, targetQuoteId, inputsSnapshotRef, actionDate, contractEffectiveDate, backdatingReasonCode, lines]
          properties:
            lifecycleChangeRevision:
              type: integer
              minimum: 2
              description: |
                Superseding LifecycleChange revision. Unique with the document.
                The first document revision is created by POST
                /contracts/{contractId}/amendments, not by this command.
            targetQuoteId:
              type: string
              format: uuid
              description: |
                Quote quote-service opened for this revision. Required so the
                new row can fill target_quote_id, which is not null on main.
                Proposed. Not a column change.
            inputsSnapshotRef:
              type: string
              minLength: 1
              description: |
                Caller-supplied snapshot ref for the new revision. Required
                because inputs_snapshot_ref is not null on main. Proposed.
                Not a column change. Pins inside the snapshot are not copied
                onto the new lines.
            actionDate: {type: string, format: date}
            contractEffectiveDate: {type: string, format: date}
            backdatingReasonCode:
              type: string
              nullable: true
              description: |
                Required property with the resolved new header value. Null
                explicitly clears the old reason. Backdating still requires
                a non-null reason and the existing validation/approval gates.
            lines:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/OpenAmendmentRevisionLine"

    OpenAmendmentRevisionLine:
      type: object
      description: |
        Commercial structure only. The server stores product, pricebook,
        configuration, and policy-decision pins as null on the new revision.
      required: [changeLineRef, actionCode, businessCategory, applyTargetType, quantitySemantics, startQty, deltaQty, endQty, effectiveFrom, chargeType, priceAsOf, policySlot, applicationUnitNo]
      properties:
        changeLineRef: {type: string, format: uuid}
        actionCode:
          $ref: "#/components/schemas/ActionCode"
        businessCategory:
          $ref: "#/components/schemas/BusinessCategory"
        applyTargetType:
          $ref: "#/components/schemas/ApplyTargetType"
        priceAsOf:
          $ref: "#/components/schemas/PriceAsOf"
        policySlot:
          $ref: "#/components/schemas/PolicySlot"
        quantitySemantics:
          $ref: "#/components/schemas/QuantitySemantics"
        startQty:
          $ref: "#/components/schemas/Money"
        deltaQty:
          $ref: "#/components/schemas/Money"
        endQty:
          $ref: "#/components/schemas/Money"
        effectiveFrom: {type: string, format: date}
        effectiveTo: {type: string, format: date, nullable: true}
        targetSubscriptionId: {type: string, format: uuid, nullable: true}
        sourceAcceptedLineUuid: {type: string, nullable: true}
        metric: {type: string, nullable: true}
        chargeType:
          allOf:
            - $ref: "#/components/schemas/ChargeType"
        applicationUnitNo:
          type: integer
          minimum: 1
          description: |
            Existing document unit number. Required because
            application_unit_no is not null on main. This proposal does not
            create or retarget application units.

    WithdrawCommand:
      allOf:
        - $ref: "#/components/schemas/VersionedCommand"
        - type: object
          properties:
            reasonCode: {type: string, nullable: true}

    SubmitAmendmentCommand:
      allOf:
        - $ref: "#/components/schemas/VersionedCommand"
        - type: object
          properties:
            contentDigest:
              allOf:
                - $ref: "#/components/schemas/Sha256"
              description: When sent, must equal the current revision digest.

    CreateAmendmentRequest:
      type: object
      required: [lifecycleChangeId, lifecycleChangeRevision, signaturePolicy]
      properties:
        lifecycleChangeId: {type: string, format: uuid}
        lifecycleChangeRevision: {type: integer, minimum: 1}
        requestIdentifier: {type: string, maxLength: 200, nullable: true}
        signaturePolicy:
          $ref: "#/components/schemas/SignaturePolicy"
        coTermDate:
          type: string
          format: date
          nullable: true
          description: Defaults to the contract end date.

    RecordApprovalCommand:
      type: object
      required: [version, decision, approvalRef]
      oneOf:
        - properties:
            decision: {type: string, enum: [APPROVED]}
        - required: [reasonCode]
          properties:
            decision: {type: string, enum: [REJECTED]}
      properties:
        version: {type: integer, minimum: 0}
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        approvalRef: {type: string, minLength: 1}
        reasonCode:
          type: string
          minLength: 1
          pattern: '\S'
          description: Required for REJECTED; persisted as the AMENDMENT_REJECTED event reason.
        autoApproved:
          type: boolean
          default: false

    LifecycleChange:
      type: object
      required:
        - id
        - intent
        - initiationTrigger
        - status
        - revision
        - version
        - actionDate
        - contractEffectiveDate
        - contractId
        - currencyCode
        - lines
        - createdAt
      properties:
        id: {type: string, format: uuid}
        intent:
          $ref: "#/components/schemas/LifecycleIntent"
        initiationTrigger:
          $ref: "#/components/schemas/InitiationTrigger"
        requestIdentifier: {type: string, nullable: true}
        status:
          $ref: "#/components/schemas/LifecycleChangeStatus"
        revision: {type: integer, minimum: 1}
        version: {type: integer, minimum: 0}
        actionDate: {type: string, format: date}
        contractEffectiveDate: {type: string, format: date}
        serviceActivationDate: {type: string, format: date, nullable: true}
        customerAcceptanceDate: {type: string, format: date, nullable: true}
        backdatingReasonCode: {type: string, nullable: true}
        contractId: {type: string, format: uuid}
        currencyCode:
          $ref: "#/components/schemas/CurrencyCode"
        outputMode:
          $ref: "#/components/schemas/OutputMode"
        contentDigest:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Sha256"
        amendmentId:
          type: string
          format: uuid
          nullable: true
          description: Set once the CAM document exists. Link by value.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ChangeLine"
        createdAt: {type: string, format: date-time}
        createdBy: {type: string}

    ChangeLine:
      type: object
      required: [lineId, actionCode, businessCategory, applyTargetType, quantitySemantics, startQty, deltaQty, endQty, effectiveFrom, chargeType, priceAsOf, policySlot]
      properties:
        lineId: {type: string, format: uuid}
        lineNo: {type: integer, minimum: 1}
        actionCode:
          $ref: "#/components/schemas/ActionCode"
        quantitySemantics:
          $ref: "#/components/schemas/QuantitySemantics"
        businessCategory:
          $ref: "#/components/schemas/BusinessCategory"
        applyTargetType:
          $ref: "#/components/schemas/ApplyTargetType"
        targetSubscriptionId: {type: string, format: uuid, nullable: true}
        sourceAcceptedLineUuid: {type: string, nullable: true}
        observedCommercialRevision: {type: integer, format: int64, nullable: true}
        startQty:
          $ref: "#/components/schemas/Money"
        deltaQty:
          $ref: "#/components/schemas/Money"
        endQty:
          $ref: "#/components/schemas/Money"
        metric: {type: string, nullable: true}
        effectiveFrom: {type: string, format: date}
        effectiveTo: {type: string, format: date, nullable: true}
        chargeType:
          $ref: "#/components/schemas/ChargeType"
        priceAsOf:
          allOf:
            - $ref: "#/components/schemas/PriceAsOf"
          default: EFFECTIVE_DATE
          description: |
            Proposed first-slice source default. S5 materializes this non-null
            hook on create/revise before calling CAM, including while unpriced.
            This is not a pricing pin and is not cleared by supersession.
        policySlot:
          allOf:
            - $ref: "#/components/schemas/PolicySlot"
          default: AMENDMENT
          description: |
            Proposed first-slice source default. S5 materializes this non-null
            hook on create/revise before calling CAM, including while unpriced.
            This is not a pricing pin and is not cleared by supersession.
        amendMode:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AmendMode"
        prorationMethod:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ProrationMethod"
        policyDecisionId: {type: string, nullable: true}
        policyId: {type: string, nullable: true}
        policyVersion: {type: string, nullable: true}
        pricingTraceId: {type: string, nullable: true}
        productExternalId: {type: string, nullable: true}
        pricebookVersion: {type: string, nullable: true}
        configurationHash:
          type: string
          nullable: true
          description: Null only on an unpriced draft. Pricing and submission require the non-null interim SHA-256 pin; equality is rechecked at apply (V9). DRG-428 later replaces the interim pin.
        unitPrice:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Money"
        netAmount:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Money"
        override:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PriceOverride"
        approvalRequestId: {type: string, nullable: true}

