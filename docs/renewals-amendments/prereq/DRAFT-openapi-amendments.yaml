    PricingDecision:
      type: object
      required: [lineId, policyDecisionId, policyId, policyVersion, pricingTraceId, productExternalId, pricebookVersion, configurationHash]
      properties:
        lineId: {type: string, format: uuid}
        policyDecisionId: {type: string}
        policyId: {type: string}
        policyVersion: {type: string}
        pricingTraceId: {type: string}
        policySlot:
          $ref: "#/components/schemas/PolicySlot"
        amendMode:
          $ref: "#/components/schemas/AmendMode"
        prorationMethod:
          $ref: "#/components/schemas/ProrationMethod"
        priceAsOf:
          $ref: "#/components/schemas/PriceAsOf"
        productExternalId: {type: string}
        pricebookVersion: {type: string}
        configurationHash:
          $ref: "#/components/schemas/Sha256"
        unitPrice:
          $ref: "#/components/schemas/Money"
        netAmount:
          $ref: "#/components/schemas/Money"
        inputsSnapshotRef: {type: string, nullable: true}

    LifecycleRevision:
      type: object
      required: [revision, status]
      properties:
        revision: {type: integer, minimum: 1}
        status:
          $ref: "#/components/schemas/LifecycleChangeStatus"
        contentDigest:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Sha256"
        frozenAt: {type: string, format: date-time, nullable: true}

    ContractHeader:
      type: object
      required: [id, contractNumber, customerAccountId, termModel, startDate, status, lastExecutedSeq]
      properties:
        id: {type: string, format: uuid}
        contractNumber: {type: string}
        customerAccountId: {type: string, format: uuid}
        termModel:
          $ref: "#/components/schemas/TermModel"
        startDate: {type: string, format: date}
        endDate:
          type: string
          format: date
          nullable: true
          description: Null when termModel is EVERGREEN.
        governingAgreementRef: {type: string, nullable: true}
        status:
          $ref: "#/components/schemas/ContractStatus"
        lastExecutedSeq:
          type: integer
          minimum: 0
          description: Advanced only in the EXECUTED transaction. A withdrawn draft does not change it.
        priorContractId: {type: string, format: uuid, nullable: true}

    AmendmentDocument:
      type: object
      required:
        - id
        - contractId
        - lifecycleChangeId
        - lifecycleChangeRevision
        - intent
        - provisionalNumber
        - documentKind
        - status
        - currentRevisionNo
        - signaturePolicy
        - actionDate
        - contractEffectiveDate
        - currencyCode
        - tcvDelta
        - arrDelta
        - oneTimeTotal
        - creditTotal
        - contentDigest
        - evidenceClass
        - version
      description: |
        No applyStatus property. amendmentSeq and amendmentNumber are null
        until EXECUTED. provisionalNumber is an opaque server string, stable
        across revisions, and is not the final amendment number. Its character
        pattern is intentionally not specified.
      properties:
        id: {type: string, format: uuid}
        contractId: {type: string, format: uuid}
        lifecycleChangeId: {type: string, format: uuid}
        lifecycleChangeRevision: {type: integer, minimum: 1}
        intent:
          $ref: "#/components/schemas/LifecycleIntent"
        initiationTrigger:
          $ref: "#/components/schemas/InitiationTrigger"
        requestIdentifier: {type: string, nullable: true}
        provisionalNumber: {type: string}
        amendmentSeq:
          type: integer
          minimum: 0
          nullable: true
        amendmentNumber:
          type: string
          nullable: true
          description: "{contractNumber}-A{seq} with seq zero-padded to 3. Null until EXECUTED."
        documentKind:
          $ref: "#/components/schemas/DocumentKind"
        status:
          $ref: "#/components/schemas/AmendmentStatus"
        currentRevisionNo: {type: integer, minimum: 1}
        executedRevisionNo: {type: integer, minimum: 1, nullable: true}
        signaturePolicy:
          $ref: "#/components/schemas/SignaturePolicy"
        approvalRef: {type: string, nullable: true}
        signatureEnvelopeRef: {type: string, nullable: true}
        actionDate: {type: string, format: date}
        contractEffectiveDate: {type: string, format: date}
        serviceActivationDate: {type: string, format: date, nullable: true}
        customerAcceptanceDate: {type: string, format: date, nullable: true}
        backdatingReasonCode: {type: string, nullable: true}
        coTermDate: {type: string, format: date, nullable: true}
        currencyCode:
          $ref: "#/components/schemas/CurrencyCode"
        tcvDelta:
          type: string
          description: 'Proposed, unaccepted: null on the current unpriced revision;

            replaced by successful pricing before submit or execute. Never

            copied from a prior revision. Requires a later storage migration.

            '
          pattern: ^-?\d{1,15}(\.\d{1,4})?$
          example: '15.0000'
          nullable: true
        arrDelta:
          type: string
          description: 'Proposed, unaccepted: null on the current unpriced revision;

            replaced by successful pricing before submit or execute. Never

            copied from a prior revision. Requires a later storage migration.

            '
          pattern: ^-?\d{1,15}(\.\d{1,4})?$
          example: '15.0000'
          nullable: true
        oneTimeTotal:
          type: string
          description: 'Proposed, unaccepted: null on the current unpriced revision;

            replaced by successful pricing before submit or execute. Never

            copied from a prior revision. Requires a later storage migration.

            '
          pattern: ^-?\d{1,15}(\.\d{1,4})?$
          example: '15.0000'
          nullable: true
        creditTotal:
          type: string
          description: 'Proposed, unaccepted: null on the current unpriced revision;

            replaced by successful pricing before submit or execute. Never

            copied from a prior revision. Requires a later storage migration.

            '
          pattern: ^-?\d{1,15}(\.\d{1,4})?$
          example: '15.0000'
          nullable: true
        contentDigest:
          type: string
          description: 'Proposed default (DRG-616, not accepted, not a migration): null on

            an unpriced draft, including a revision opened by supersession,

            until a later submit stores the digest. The field schema on main

            still says content_digest is not null. OQ18 stays Proposed, so

            this file does not define canonicalization.

            '
          pattern: ^[a-f0-9]{64}$
          nullable: true
        renditionDigest:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Sha256"
        signedCopySha256:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Sha256"
        templateId: {type: string, nullable: true}
        templateVersion: {type: string, nullable: true}
        supersedesDocumentId: {type: string, format: uuid, nullable: true}
        supersededByDocumentId: {type: string, format: uuid, nullable: true}
        voidsDocumentId: {type: string, format: uuid, nullable: true}
        evidenceClass:
          $ref: "#/components/schemas/EvidenceClass"
        retentionUntil:
          type: string
          format: date
          nullable: true
          description: Not computed in this slice (OQ8).
        legalHold: {type: boolean}
        expiresAt: {type: string, format: date-time, nullable: true}
        executedAt: {type: string, format: date-time, nullable: true}
        appliedAt: {type: string, format: date-time, nullable: true}
        version: {type: integer, minimum: 0}
        lines:
          type: array
          minItems: 1
          description: Present on GET by id (current revision). Omitted on list items.
          items:
            $ref: "#/components/schemas/AmendmentLine"
        createdAt: {type: string, format: date-time}
        createdBy: {type: string}

    AmendmentLine:
      type: object
      required:
        - id
        - lineNo
        - changeLineRef
        - actionCode
        - quantitySemantics
        - startQty
        - deltaQty
        - endQty
        - effectiveFrom
        - applicationUnitNo
      properties:
        id: {type: string, format: uuid}
        lineNo: {type: integer, minimum: 1}
        revisionNo: {type: integer, minimum: 1}
        changeLineRef: {type: string, format: uuid}
        actionCode:
          $ref: "#/components/schemas/ActionCode"
        businessCategory:
          $ref: "#/components/schemas/BusinessCategory"
        applyTargetType:
          $ref: "#/components/schemas/ApplyTargetType"
        targetSubscriptionId: {type: string, format: uuid, nullable: true}
        sourceAcceptedLineUuid: {type: string, nullable: true}
        resultAcceptedLineUuid: {type: string, nullable: true}
        quantitySemantics:
          $ref: "#/components/schemas/QuantitySemantics"
        startQty:
          $ref: "#/components/schemas/Money"
        deltaQty:
          $ref: "#/components/schemas/Money"
        endQty:
          $ref: "#/components/schemas/Money"
        metric: {type: string, nullable: true}
        effectiveFrom: {type: string, format: date}
        effectiveTo: {type: string, format: date, nullable: true}
        chargeType:
          $ref: "#/components/schemas/ChargeType"
        priceAsOf:
          $ref: "#/components/schemas/PriceAsOf"
        productExternalId:
          type: string
          nullable: true
          description: |
            Proposed default (DRG-616, not accepted, not a migration): null on
            an unpriced revision, including a revision opened by supersession.
            V9 still requires a non-null pin before submit and at apply. The
            field schema on main still says this column is not null.
        pricebookVersion:
          type: string
          nullable: true
          description: |
            Same Proposed default as productExternalId. Null until pricing
            pins the pricebook (V9). The field schema on main still says not
            null.
        configurationHash:
          type: string
          description: 'Same Proposed default. Null on an unpriced revision. When present,

            the interim pin is lowercase SHA-256. DRG-428 later replaces that

            pin. The field schema on main still says the column is not null.

            '
          pattern: ^[a-f0-9]{64}$
          nullable: true
        unitPrice:
          type: string
          description: Decimal numeric(19,4), transported as a string.
          pattern: ^-?\d{1,15}(\.\d{1,4})?$
          example: '15.0000'
          nullable: true
        netAmount:
          type: string
          description: Decimal numeric(19,4), transported as a string.
          pattern: ^-?\d{1,15}(\.\d{1,4})?$
          example: '15.0000'
          nullable: true
        policySlot:
          $ref: "#/components/schemas/PolicySlot"
        policyId: {type: string, nullable: true}
        policyVersion: {type: string, nullable: true}
        policyDecisionId: {type: string, nullable: true}
        pricingTraceId: {type: string, nullable: true}
        applicationUnitNo: {type: integer, minimum: 1}
        override:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PriceOverride"

    AmendmentRevision:
      type: object
      required: [revisionNo, lifecycleChangeRevision, targetQuoteId, contentDigest, statusAtClose]
      properties:
        revisionNo: {type: integer, minimum: 1}
        lifecycleChangeRevision: {type: integer, minimum: 1}
        targetQuoteId:
          type: string
          format: uuid
          description: Quote opened for this revision. The proposed CAM write requires the caller to send it.
        contentDigest:
          type: string
          description: 'Proposed default (DRG-616, not accepted, not a migration): null

            while this revision is an unpriced DRAFT. The superseded revision

            keeps its digest. The field schema on main still says not null.

            OQ18 stays Proposed.

            '
          pattern: ^[a-f0-9]{64}$
          nullable: true
        inputsSnapshotRef: {type: string}
        statusAtClose:
