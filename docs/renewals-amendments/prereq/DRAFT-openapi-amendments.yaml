  /amendments/{amendmentId}:submit:
    parameters:
      - $ref: "#/components/parameters/AmendmentId"
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      tags: [amendments]
      operationId: submitAmendment
      summary: Submit a priced draft for review
      description: |
        From DRAFT only, and only when the current revision is priced and
        contentDigest is present. Runs V1 through V14. Success moves status
        to IN_REVIEW and returns the digest (AC-S3-2).

        Any failing rule returns 422 VALIDATION_REJECTED, leaves status
        unchanged, and appends ValidationRejected naming that rule id. V6
        fails when contractEffectiveDate is before actionDate and
        backdatingReasonCode is absent (AC-S3-8).

        The same revision and digest submitted again is a no-op (200,
        Idempotent-Replayed true). A digest mismatch is 409.
      x-opencrm-slice: S3
      x-opencrm-acceptance: [AC-S3-2, AC-S3-8]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAmendmentCommand"
      responses:
        "200":
          description: Status IN_REVIEW, with contentDigest.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmendmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Rule failure. State unchanged. Example is V6.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                errorCode: VALIDATION_REJECTED
                message: Validation failed
                errors:
                  - "V6: backdating requires a reason code"
                violations:
                  - ruleId: V6
                    message: Effective date is before the action date and backdatingReasonCode is absent
                    field: backdatingReasonCode
                timestamp: "2026-11-01T12:00:00Z"

  /amendments/{amendmentId}:record-approval:
    parameters:
      - $ref: "#/components/parameters/AmendmentId"
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      tags: [amendments]
      operationId: recordAmendmentApproval
      summary: Record an approval-routing decision
      description: |
        Called when approval-routing decides CONTRACT_MODIFICATION, or when
        the change is auto-approved under the threshold. The approval
        threshold amount is not defined here (S5 OQ17).

        APPROVED stores approvalRef and moves IN_REVIEW to APPROVED.
        When signaturePolicy is NOT_REQUIRED or NOTICE_ONLY, the same
        transaction continues to EXECUTED and assigns the gapless number
        (auto-execute). CLICK_THROUGH stops at APPROVED until `:accept`.
        WET and E_SIGN stop at APPROVED; they do not execute.

        REJECTED moves to REJECTED (terminal).

        A re-delivered decision for the same revision and approvalRef is a
        no-op. Two documents executing concurrently on one contract receive
        consecutive sequences with no gap (AC-S3-6).
      x-opencrm-slice: S3
      x-opencrm-acceptance: [AC-S3-6]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordApprovalCommand"
      responses:
        "200":
          description: APPROVED, EXECUTED (auto-execute), or REJECTED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmendmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /amendments/{amendmentId}:accept:
    parameters:
      - $ref: "#/components/parameters/AmendmentId"
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      tags: [amendments]
      operationId: acceptAmendment
      summary: Accept click-through and execute
      description: |
        From APPROVED, signaturePolicy CLICK_THROUGH only. One transaction
        sets EXECUTED, executedAt, executedRevisionNo, and
        amendmentNumber = `{contractNumber}-A{amendmentSeq}` with the
        sequence equal to the contract lastExecutedSeq plus 1 (AC-S3-3).

        WET or E_SIGN returns 422 SIGNATURE_NOT_SUPPORTED_IN_SLICE and does
        not change status (AC-S3-4). NOTICE_ONLY and NOT_REQUIRED do not use
        this operation; they auto-execute in `:record-approval`.

        A second accept of the same executed revision is a no-op.
        Concurrent accepts of two documents on one contract take N+1 and N+2
        (AC-S3-6).
      x-opencrm-slice: S3
      x-opencrm-acceptance: [AC-S3-3, AC-S3-4, AC-S3-6]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedCommand"
      responses:
        "200":
          description: EXECUTED, with amendmentSeq and amendmentNumber.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmendmentResponse"
              example:
                success: true
                data:
                  id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
                  contractId: "6b1c2a10-0c3a-4b7e-9f11-2a6e0c9d4b21"
                  provisionalNumber: "C-100-P-aaaaaaaa"
                  amendmentSeq: 3
                  amendmentNumber: C-100-A003
                  documentKind: AMENDMENT
                  status: EXECUTED
                  signaturePolicy: CLICK_THROUGH
                  version: 4
                timestamp: "2026-11-02T09:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

