openapi: 3.0.3
info:
  title: Amendments and lifecycle changes (DRAFT proposal)
  version: 0.1.1-draft
  description: |
    Proposal only. This file is not an implementation, a gateway route, or a
    feature flag. It does not authorize merging, deploying, or enabling any
    runtime flag.

    Status of every default in this file: Proposed, unaccepted, owner decision
    required. This file is not an input to code generation and it defines no
    contract test.

    HTTP contract for the contract-documents module and for quote-service
    lifecycle changes, so DRG-537 (renewals and amendments UI), DRG-581 (S3)
    and DRG-583 (S5) can share one shape.

    Owners, from the renewals-amendments specs:
    - quote-service owns LifecycleChange (intent, change lines, pricing calls).
    - contract-asset-management, contract-documents module, owns ContractHeader,
      AmendmentDocument, revisions, lines, application units and the append-only
      event log, at `/contracts/{contractId}/amendments`.
    - The module never writes rate periods. The CAM ledger is the only writer
      of applied state.
    - Cross-service links are uuid plus digest. No cross-database foreign keys.

    Binding decisions already recorded (do not re-open in this draft):
    - OQ2: one `status` column. No `applyStatus`. Apply runs only after EXECUTED.
    - OQ4: `provisionalNumber` at DRAFT, stable across revisions. `amendmentSeq`
      is assigned at EXECUTED as last executed sequence plus 1, in the same
      transaction, under the contract row lock. Final number is
      `{contractNumber}-A{seq}` zero-padded to 3 digits. A withdrawn draft
      consumes no sequence. Numbering does not reset on renewal.

    First slice (S3 and S5):
    - LifecycleChange intent AMEND only.
    - Change-line action codes ADD, UPDATE, REMOVE. SWAP, UPGRADE and DOWNGRADE
      may be stored and are rejected at lifecycle submit with
      ACTION_NOT_SUPPORTED_IN_SLICE.
    - Quantity semantics DELTA and ABSOLUTE only.
    - Signature policies that may reach EXECUTED: NOT_REQUIRED, NOTICE_ONLY
      (auto-execute when approval is recorded) and CLICK_THROUGH (client
      `:accept`). WET and E_SIGN return 422 SIGNATURE_NOT_SUPPORTED_IN_SLICE
      and leave state unchanged.
    - Validation V1 through V14. A failing rule leaves state unchanged and
      appends a ValidationRejected event that names the rule id.
    - Pricing is performed by pricing-service. Quote-service and CAM store the
      decision; they do not recompute price.

    Paths are the project REST prefix `/api/v1` plus the spike resource names.
    JSON properties are camelCase. Enum values are SCREAMING_SNAKE, matching
    existing Java enums such as QuoteStatus. Database columns in the field
    schema stay snake_case; this document is the HTTP mapping.

    Money is a decimal string so numeric(19,4) scale survives JSON. Digests are
    lowercase hex SHA-256. Canonical JSON for `contentDigest` is the shared
    digest library (S3 dependency, location still open). This proposal does not
    define the canonicalization algorithm. OQ18 remains Proposed. This file
    does not confirm OQ18 and does not authorize building that library.

    DRG-616 records three contracts. Each default is Proposed, unaccepted,
    owner decision required.
    POST /amendments/{amendmentId}/revisions is the proposed CAM revision
    write. It follows the OQ6 ruling recorded in pull request #642: before
    execution, a new revision under the same document number, the old revision
    frozen SUPERSEDED, the new revision DRAFT, pricing pins cleared, approvals
    and signatures void; after EXECUTED, no new revision; at most one EXECUTED
    revision. Nullable pins and a local supersession log name are Proposed
    defaults in story-drg-616-oq6-design-contract-gaps.md. Accepting this file
    authorizes no code, migration, or deploy. S6 is not authorized. ADR-017
    and ADR-024 through ADR-027 are not accepted here. The DRG-609 design is
    not accepted. S3 / DRG-581 is not authorized by this file.

    Browser calls go through the gateway (:8080) with the session cookie and
    the ADR-004 CSRF header. Bearer calls send Authorization and no CSRF token.
    Domain services stay stateless; this proposal adds no credential type.

    Out of this slice, named so they are not implied: S4 apply, S6 event-bus
    payload, renewal intent, price-lock segments, DRG-592 new-contract versus
    amend-in-place as a second resource, DRG-595 role enforcement, e-sign
    envelopes, rendition, void and rebase. Those operations are listed only
    where the spike already names the resource, and they are marked later.

  x-opencrm-status: proposal
  x-opencrm-unblocks:
    - DRG-537
    - DRG-581
    - DRG-583
  x-opencrm-sources:
    - docs/renewals-amendments/mid-term-amendment-policy-spec.md
    - docs/renewals-amendments/amendment-entity-field-schema.md
    - docs/renewals-amendments/amendment-document-design-spike.md
    - docs/renewals-amendments/rca-sda-amendment-placement.md
    - docs/renewals-amendments/cpq-renewals-amendments-research.md
    - docs/renewals-amendments/renewal-policy-stub.md
    - docs/renewals-amendments/prereq/oq6-revision-model-owner-decision.md
    - docs/renewals-amendments/prereq/story-drg-616-oq6-design-contract-gaps.md
  x-opencrm-acceptance:
    AC-S3-1: "POST /contracts/{contractId}/amendments with the same lifecycleChangeId returns one document."
    AC-S3-2: "POST /amendments/{amendmentId}:submit moves a valid priced draft to IN_REVIEW and returns contentDigest. A failing rule returns 422, leaves status unchanged, and names the rule id."
    AC-S3-3: "POST /amendments/{amendmentId}:accept on APPROVED plus CLICK_THROUGH returns EXECUTED and amendmentNumber {contractNumber}-A{nnn} from one transaction."
    AC-S3-4: "POST /amendments/{amendmentId}:send-for-signature, and :accept when policy is WET or E_SIGN, return 422 SIGNATURE_NOT_SUPPORTED_IN_SLICE with status unchanged."
    AC-S3-5: "Any mutation of an EXECUTED document returns 409 IMMUTABLE_EXECUTED and an audit event is written."
    AC-S3-6: "Two concurrent executes of different documents on one contract receive consecutive amendmentSeq values with no gap."
    AC-S3-7: "POST :withdraw from DRAFT leaves amendmentSeq null and does not advance the contract lastExecutedSeq."
    AC-S3-8: "Backdating without backdatingReasonCode fails V6 (422, state unchanged)."
    AC-S5-1: "POST /lifecycle-changes stores an AMEND change with lines, action codes, quantity semantics and observed revisions."
    AC-S5-2: "POST :price with RETAIN_CONTRACTED and DAILY returns policyDecisionId, policyId, policyVersion, pricingTraceId and pins."
    AC-S5-3: "POST /lifecycle-changes/{id}:submit rejects SWAP, UPGRADE or DOWNGRADE with ACTION_NOT_SUPPORTED_IN_SLICE."
    AC-S5-4: "A price override stores actor (from the principal), reasonCode and value, and returns approvalRequestId."
    AC-S5-5: "POST /quotes/continuations keeps the existing QuoteDto response. When the S5 facade behavior is active it also creates a LifecycleChange. This proposal does not name or enable a flag."
    AC-S5-6: "A target subscription that is not ACTIVE is rejected with VALIDATION_REJECTED and ruleId V2."

servers:
  - url: /api/v1
    description: Gateway prefix. quote-service and contract-asset-management are both reached through the gateway.

tags:
  - name: lifecycle-changes
    description: quote-service commercial intent. First slice is intent AMEND. S5.
  - name: amendments
    description: CAM contract-documents module. Legal and evidentiary wrapper. S3.
  - name: contracts
    description: Thin contract header read model. Create and enrich stay with DRG-458.
  - name: continuations
    description: Existing quote continuation facade. Response shape stays QuoteDto. S5.
  - name: later
    description: Spike resource names that are not in the S3 or S5 slice.

security:
  - cookieSession: []
  - bearerAuth: []

paths:
  /lifecycle-changes:
    post:
      tags: [lifecycle-changes]
      operationId: createLifecycleChange
      summary: Create an Amend lifecycle change
      description: |
        Seller or headless command. Stores intent AMEND, the lines, quantity
        semantics and observed revisions (AC-S5-1). Does not price and does not
        open the amendment document.

        A second request with the same requestIdentifier (body or
        Idempotency-Key) and the same body returns the original change with
        Idempotent-Replayed true. The same key with a different body is 409
        IDEMPOTENCY_CONFLICT.

        Intent other than AMEND is rejected (INTENT_NOT_SUPPORTED_IN_SLICE).
        A target subscription that is not ACTIVE is rejected with rule V2 and
        no resource is stored (AC-S5-6). SWAP, UPGRADE and DOWNGRADE may be
        stored; they fail later at submit (AC-S5-3). Any other action code is
        rejected here with ACTION_NOT_SUPPORTED_IN_SLICE.
      x-opencrm-slice: S5
      x-opencrm-acceptance: [AC-S5-1, AC-S5-6]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLifecycleChangeRequest"
            example:
              intent: AMEND
              initiationTrigger: MANUAL
              actionDate: "2026-11-01"
              contractEffectiveDate: "2026-11-01"
              contractId: "6b1c2a10-0c3a-4b7e-9f11-2a6e0c9d4b21"
              currencyCode: USD
              outputMode: QUOTE
              lines:
                - actionCode: UPDATE
                  quantitySemantics: DELTA
                  targetSubscriptionId: "9c0e1f22-7a11-4d33-8b44-1e2f3a4b5c6d"
                  sourceAcceptedLineUuid: "line-accepted-1"
                  observedCommercialRevision: 4
                  startQty: "10.0000"
                  deltaQty: "5.0000"
                  endQty: "15.0000"
                  effectiveFrom: "2026-11-01"
                  effectiveTo: "2027-10-31"
                - actionCode: ADD
                  quantitySemantics: ABSOLUTE
                  startQty: "0.0000"
                  deltaQty: "2.0000"
                  endQty: "2.0000"
                  effectiveFrom: "2026-11-01"
                  effectiveTo: "2027-10-31"
                  productExternalId: "sku-seat"
      responses:
        "201":
          description: Lifecycle change created in DRAFT.
          headers:
            Location:
              schema: {type: string}
              description: URI of the new lifecycle change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleChangeResponse"
        "200":
          $ref: "#/components/responses/IdempotentReplayLifecycleChange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [lifecycle-changes]
      operationId: listLifecycleChanges
      summary: List lifecycle changes
      description: |
        Review list for the start and review flow. Filters are exact matches.
        Ordered by createdAt descending.
      x-opencrm-slice: S5
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: contractId
          in: query
          schema: {type: string, format: uuid}
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/LifecycleChangeStatus"
        - name: intent
          in: query
          schema:
            $ref: "#/components/schemas/LifecycleIntent"
      responses:
        "200":
          description: Page of lifecycle changes. `data` is the array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleChangePageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /lifecycle-changes/{lifecycleChangeId}:
    parameters:
      - $ref: "#/components/parameters/LifecycleChangeId"
    get:
      tags: [lifecycle-changes]
      operationId: getLifecycleChange
      summary: Get a lifecycle change
      description: Returns the change, its current lines, and pricing pins when present.
      x-opencrm-slice: S5
      responses:
        "200":
          description: The lifecycle change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleChangeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /lifecycle-changes/{lifecycleChangeId}/revisions:
    parameters:
      - $ref: "#/components/parameters/LifecycleChangeId"
    get:
      tags: [lifecycle-changes]
      operationId: listLifecycleChangeRevisions
      summary: List lifecycle change revisions
      x-opencrm-slice: S5
      responses:
        "200":
          description: Revisions, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleRevisionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      tags: [lifecycle-changes]
      operationId: createLifecycleChangeRevision
      summary: Open a new revision from a draft edit
      description: |
        Allowed from DRAFT, PRICED, IN_APPROVAL, APPROVED and PRESENTED.
        Those are LifecycleChange statuses. They are not the CAM document
        status list. The previous revision is frozen SUPERSEDED. At most one
        revision of the linked amendment document can reach EXECUTED. A new
        revision of an already EXECUTED document is refused with
        IMMUTABLE_EXECUTED (AC-S3-5); the correction path is a new lifecycle
        change.

        This operation is the quote-service revision. It is not the CAM write,
        and it does not insert amendment_document_revisions. The CAM command
        is POST /amendments/{amendmentId}/revisions. That command is a
        proposal (DRG-616) and is not accepted.
      x-opencrm-slice: S5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviseLifecycleChangeRequest"
      responses:
        "201":
          description: New current revision. Status returns to DRAFT. Pricing pins on the new revision are cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleChangeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /lifecycle-changes/{lifecycleChangeId}:price:
    parameters:
      - $ref: "#/components/parameters/LifecycleChangeId"
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      tags: [lifecycle-changes]
      operationId: priceLifecycleChange
      summary: Price lines through pricing-service
      description: |
        Calls pricing-service and stores the decision on each priced line
        (AC-S5-2). Quote-service does not calculate the price itself.

        First-slice mode used by the acceptance case is RETAIN_CONTRACTED with
        proration DAILY. LIST, OVERRIDE, MONTH_DAY, NONE and NEXT_CYCLE are
        accepted on the request so the policy slot can be recorded; whether
        pricing-service can evaluate them is a prerequisite check (S5 risk),
        not a second pricing implementation.

        An override sends value and reasonCode. The actor is the authenticated
        principal. The response includes approvalRequestId for
        CONTRACT_MODIFICATION (AC-S5-4). productExternalId, pricebookVersion and
        configurationHash are required and non-null on every priced line. The
        interim configurationHash is the lowercase SHA-256 of the canonical
        product id, pricebook version and sorted option codes defined by the
        technical approach; DRG-428 later replaces that pin without making it
        nullable.

        A target that is not ACTIVE fails V2. Status becomes PRICED when every
        priced line has a decision. Re-pricing the same revision replaces the
        unpinned draft decision and bumps version. Re-pricing after IN_APPROVAL
        requires a new revision.
      x-opencrm-slice: S5
      x-opencrm-acceptance: [AC-S5-2, AC-S5-4, AC-S5-6]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceLifecycleChangeRequest"
            example:
              version: 1
              lines:
                - lineId: "11111111-1111-1111-1111-111111111111"
                  amendMode: RETAIN_CONTRACTED
                  prorationMethod: DAILY
                  priceAsOf: EFFECTIVE_DATE
      responses:
        "200":
          description: Lines pinned with policy decisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleChangeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /lifecycle-changes/{lifecycleChangeId}/pricing-decisions:
    parameters:
      - $ref: "#/components/parameters/LifecycleChangeId"
    get:
      tags: [lifecycle-changes]
      operationId: listPricingDecisions
      summary: List stored pricing decisions for the current revision
      x-opencrm-slice: S5
      responses:
        "200":
          description: One decision per priced line.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingDecisionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /lifecycle-changes/{lifecycleChangeId}:submit:
    parameters:
      - $ref: "#/components/parameters/LifecycleChangeId"
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      tags: [lifecycle-changes]
      operationId: submitLifecycleChange
      summary: Submit the commercial change for approval
      description: |
        From PRICED only. Moves status to IN_APPROVAL.

        SWAP, UPGRADE or DOWNGRADE on any current line returns 422
        ACTION_NOT_SUPPORTED_IN_SLICE and leaves status unchanged (AC-S5-3).
        A target that is not ACTIVE returns rule V2 (AC-S5-6). A priced line
        missing policyDecisionId, policyId, policyVersion or pricingTraceId
        fails V8. Product, pricebook and configuration pins must be present and
        non-null (V9); the owner-selected interim configurationHash is required
        until DRG-428 supplies its replacement. An absent pin returns 422 and
        leaves the state unchanged.

        Repeating submit for the same revision and contentDigest is a no-op
        and returns 200 with Idempotent-Replayed true.
      x-opencrm-slice: S5
      x-opencrm-acceptance: [AC-S5-3, AC-S5-6]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedCommand"
      responses:
        "200":
          description: Status IN_APPROVAL, or the same state on a replay.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleChangeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /lifecycle-changes/{lifecycleChangeId}:withdraw:
    parameters:
      - $ref: "#/components/parameters/LifecycleChangeId"
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      tags: [lifecycle-changes]
      operationId: withdrawLifecycleChange
      summary: Withdraw a lifecycle change that is not yet applied
      description: |
        Allowed before ORDERED or APPLIED. Status becomes WITHDRAWN. A second
        withdraw is a no-op. Does not assign an amendment sequence.
      x-opencrm-slice: S5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawCommand"
      responses:
        "200":
          description: Status WITHDRAWN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleChangeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /contracts/{contractId}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      tags: [contracts]
      operationId: getContract
      summary: Read the thin contract header
      description: |
        Read model for the amendment screen (number, term, status,
        lastExecutedSeq). This proposal does not define create or update.
        Header enrichment remains DRG-458 (OQ3).
      x-opencrm-slice: S3-read
      responses:
        "200":
          description: Contract header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{contractId}/amendments:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      tags: [amendments]
      operationId: createAmendment
      summary: Open a draft amendment from a lifecycle change
      description: |
        Idempotent on lifecycleChangeId (AC-S3-1). The first request creates
        one AmendmentDocument in DRAFT, copies the lifecycle change keys, and
        assigns provisionalNumber. amendmentSeq and amendmentNumber stay null.
        The same lifecycleChangeId returns that document with 200 and
        Idempotent-Replayed true. The same id with a different
        lifecycleChangeRevision or a different content digest is 409
        IDEMPOTENCY_CONFLICT. A further edit is a new revision, not a second
        create.

        Every target subscription on the change must belong to this contract
        (V1). The document is single-contract.

        requestIdentifier, when present, is unique per tenant and is the
        headless idempotency key in addition to lifecycleChangeId.
      x-opencrm-slice: S3
      x-opencrm-acceptance: [AC-S3-1]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAmendmentRequest"
      responses:
        "201":
          description: Draft created. provisionalNumber is set. amendmentSeq is null.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmendmentResponse"
        "200":
          $ref: "#/components/responses/IdempotentReplayAmendment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [amendments]
      operationId: listContractAmendments
      summary: List amendment documents for a contract
      description: |
        Includes the original and every amendment. Ordered by provisional
        creation time. Executed documents also sort by amendmentSeq.
      x-opencrm-slice: S3
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AmendmentStatus"
        - name: documentKind
          in: query
          schema:
            $ref: "#/components/schemas/DocumentKind"
      responses:
        "200":
          description: Page of amendment documents. Lines are not embedded on the list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmendmentPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /amendments/{amendmentId}:
    parameters:
      - $ref: "#/components/parameters/AmendmentId"
    get:
      tags: [amendments]
      operationId: getAmendment
      summary: Get an amendment document
      description: |
        Header, current revision summary, and the current revision's lines.
        Totals are the digest-bound copies. They are never recomputed here.
      x-opencrm-slice: S3
      responses:
        "200":
          description: The amendment document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmendmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /amendments/{amendmentId}/revisions:
    parameters:
      - $ref: "#/components/parameters/AmendmentId"
    get:
      tags: [amendments]
      operationId: listAmendmentRevisions
      summary: List document revisions
      description: |
        At most one revision has statusAtClose EXECUTED.
        The proposed write on this path is not accepted.
      x-opencrm-slice: S3
      responses:
        "200":
          description: Revisions in revisionNo order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmendmentRevisionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      tags: [amendments]
      operationId: openAmendmentRevision
      summary: Open a new document revision before execution (proposal)
      description: |
        Proposal only. Status: Proposed. Not accepted. This operation does
        not authorize S3, S5, S6, a migration, a flag, a topic, or a deploy.
        OQ18 stays Proposed. ADR-017 and ADR-024 through ADR-027 stay
        Proposed. The DRG-609 design is not accepted. S3 / DRG-581 needs a
        separate owner authorization. S6 is not authorized.

        CAM owns this command. S5 would call it after a separate authorization
        of that story. Draft criterion AC-S5-7 is a proposal in the
        requirements file. This operation does not adopt it.

        The behavior follows the OQ6 ruling recorded in #642. That ruling is
        not re-decided here. Before execution (document status DRAFT,
        IN_REVIEW, or APPROVED), the command opens a new revision under the
        same document number. The old revision is frozen with statusAtClose
        SUPERSEDED and keeps its content digest. The new revision is DRAFT
        (statusAtClose OPEN). Pricing pins on the new revision are cleared.
        Approvals and signatures are void: approvalRef and
        signatureEnvelopeRef are null. After EXECUTED, including APPLIED,
        PARTIALLY_APPLIED, and APPLY_BLOCKED, no new revision is stored. At
        most one revision may be EXECUTED. REJECTED and WITHDRAWN stay
        terminal. Document status SUPERSEDED is a different, later
        restatement event and is not this command. OUT_FOR_SIGNATURE is not
        reachable in the slice; the command returns 409 and does not void an
        envelope.

        Request. actionDate, contractEffectiveDate and backdatingReasonCode
        carry the resolved new commercial header, after quote-service has
        applied its revision patch. Before any replacement, CAM must archive
        the previous revision's complete commercial evidence in an immutable
        revision-bound envelope and bind that envelope through the previous
        revision's inputs_snapshot_ref. It contains the prior actionDate,
        contractEffectiveDate, serviceActivationDate, customerAcceptanceDate,
        backdatingReasonCode, coTermDate, currency, all four totals, lines,
        pins/trace and every other commercial field covered by its digest,
        plus the original input-snapshot reference. An unfrozen OPEN row may
        acquire this envelope reference in the freeze transaction; once
        frozen its reference and envelope never change. Each envelope is
        retained independently of current header values. Archive/binding
        failure aborts the revision transaction. A later write to an OPEN
        revision creates a new immutable envelope and only replaces that
        OPEN row's reference; it never overwrites an older envelope. The
        durable snapshot-store contract still requires separate acceptance;
        digest-library work also waits on owner confirmation of OQ18.
        S3/S5 stays blocked without those accepted prerequisites.
        CAM then replaces those header values in the
        same transaction that opens the revision; a null backdatingReasonCode
        explicitly clears the old reason. It validates the revised dates,
        including backdating rules, and digests the revised header on submit.
        Header fields not exposed by ReviseLifecycleChangeRequest stay
        unchanged. No date is silently taken from the previous revision.
        Each line explicitly supplies businessCategory, applyTargetType,
        chargeType, priceAsOf and policySlot; CAM invents no database default
        for these NOT NULL commercial fields. S5 materializes the values on
        its ChangeLine revision response before the CAM call, even when
        unpriced. Proposed first-slice source defaults are priceAsOf
        EFFECTIVE_DATE, policySlot AMENDMENT, applyTargetType SUBSCRIPTION,
        and chargeType RECURRING; explicit supported price-as-of choices are
        retained. businessCategory is resolved under the separately accepted
        action/category policy; missing or unresolved category refuses the
        handoff rather than making CAM invent one. No incomplete source
        operation is reported complete. These are proposal rules, not runtime
        behavior or acceptance of the Cluster E defaults. Existing
        source/target and action/category constraints still apply.

        version is the amendment document row version the caller read.
        lifecycleChangeRevision is the superseding LifecycleChange
        revision and is unique per document. targetQuoteId and
        inputsSnapshotRef are required because those columns are not null on
        main. lines carry commercial structure only. The server stores
        product, pricebook, configuration, and policy-decision pins as null
        on the new revision and ignores any price sent by a client. The
        persisted shape of a cleared pin is the Proposed default in
        story-drg-616-oq6-design-contract-gaps.md (nullable while unpriced,
        with frozen values preserved). That default is not a migration. The field
        schema has a proposal addendum only. Freezing a never-submitted
        unpriced draft still needs an accepted digest-at-close contract;
        the null open digest does not resolve that storage gap.

        Idempotency. The same Idempotency-Key and the same body returns 200
        with Idempotent-Replayed true and does not open a second revision.
        The same key with a different body returns 409 IDEMPOTENCY_CONFLICT.
        A later command whose lifecycleChangeRevision already has a revision
        returns 200 when the body matches that revision, and 409
        IDEMPOTENCY_CONFLICT when it does not.

        Errors leave the document, its revisions, and its digests unchanged:
        - 409 VERSION_CONFLICT when version is stale. A concurrent execute
          that commits first makes the revision command lose. A retry that
          then observes an executed document returns 409 IMMUTABLE_EXECUTED.
        - 409 IMMUTABLE_EXECUTED when status is EXECUTED, APPLIED,
          PARTIALLY_APPLIED, or APPLY_BLOCKED, or when any revision is
          already EXECUTED.
        - 409 ILLEGAL_TRANSITION when status is REJECTED, WITHDRAWN,
          OUT_FOR_SIGNATURE, EXPIRED, SUPERSEDED, or VOID.
        - 422 VALIDATION_REJECTED when lifecycleChangeRevision is not the
          next revision for this document, or the lifecycle change does not
          belong to this document.

        On 201, status is DRAFT, provisionalNumber is unchanged, amendmentSeq
        and amendmentNumber stay null, current contentDigest is null until a
        later submit, the previous revision stays frozen with its digest, and
        version is the post-commit document row version. Current tcvDelta,
        arrDelta, oneTimeTotal and creditTotal are null while unpriced, never
        copied from the superseded header and never filled with placeholder
        zeroes. Desired later behavior, not a completed delivery contract: a
        successful pricing synchronization would atomically replace all four
        totals with newly calculated values for this revision, together with
        its pins and trace. No CAM priced-state synchronization write or
        delivery event is defined in this draft. The LifecycleChange :price
        operation is quote-service state only and does not perform that CAM
        write; this revisions command accepts no prices or pins either.
        S3/S5 implementation remains blocked until a separate accepted
        contract specifies that CAM write/delivery, expected document version
        and revision, all totals/pins/trace, idempotency, and stale-result
        refusal. No endpoint is inferred or authorized here. Submit and execute require those totals to
        be non-null and current. This is an unaccepted nullability proposal
        requiring a later migration; the existing NOT NULL storage cannot
        implement it unchanged. Frozen revision snapshots remain unchanged.
        Each line carries applicationUnitNo. This proposal does not create or retarget
        application units.

        The same transaction appends one local document-log row. The Proposed
        default type name on success is AMENDMENT_SUPERSEDED. That name is
        not an accepted bus schema, topic, or outbox contract. S6 schema
        registration and contract tests are out of this proposal. A 409
        IMMUTABLE_EXECUTED or terminal 409 also appends a local audit row.
        The refusal type name is not chosen in this proposal.
      x-opencrm-slice: S3
      x-opencrm-status: proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAmendmentRevisionRequest"
      responses:
        "201":
          description: |
            New current revision. Status DRAFT. Same provisional number.
            Pins on the new revision are cleared. Approvals and signatures
            are void. Proposal only. Not accepted.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmendmentResponse"
        "200":
          description: Replay of the same command. No second revision.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmendmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

