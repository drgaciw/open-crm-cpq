# Manual fallback only — primary CI runs in Jenkins (see docs/ci-jenkins-cutover.md).
# Automatic push/PR triggers are intentionally disabled (Option B cutover).
name: CI (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  backend-integration:
    name: Backend Integration (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Simulated failing stage (self-test)
        run: |
          mkdir -p backend/demo/target/surefire-reports
          printf '<testsuite name="d"><testcase classname="com.opencrm.demo.SelfTestIT" name="relays"><failure message="expected 1 but was 0">java.lang.AssertionError\nCaused by: org.testcontainers.ContainerLaunchException: timed out</failure></testcase></testsuite>' > backend/demo/target/surefire-reports/TEST-demo.xml
          exit 1
      - name: Name failing tests
        if: failure()
        run: python3 scripts/ci/report-test-failures.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-reports
          path: backend/**/target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 7

