# Manual fallback only — primary CI runs in Jenkins (see docs/ci-jenkins-cutover.md).
# Automatic push/PR triggers are intentionally disabled (Option B cutover).
name: CI (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  shared-libraries:
    name: Shared Libraries (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      # Manual fallback has no Toolchain job; mirror blocking non-AI drift gate (ADR-003).
      - name: CI contract drift check
        run: python3 .cursor/skills/ci-contract-drift-check/scripts/verify-drift.py
      - name: Verify shared libraries
        run: bash scripts/ci/run-core.sh shared-libraries
      - name: Upload shared library test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-library-test-reports
          path: backend/libs/**/target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 7

  backend-unit:
    name: Backend Unit (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Fast unit verification
        run: bash scripts/ci/run-core.sh backend-unit
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-reports
          path: backend/**/target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 7

  backend-integration:
    name: Backend Integration (Testcontainers)
    runs-on: ubuntu-latest
    needs: [shared-libraries, backend-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Full Docker-backed verification
        run: bash scripts/ci/run-core.sh backend-integration 2>&1 | tee mvn-integration.log
      - name: Diagnostic - failing tests as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET, re
          fails=[]
          for f in glob.glob('backend/**/target/surefire-reports/*.xml', recursive=True)+glob.glob('backend/**/target/failsafe-reports/*.xml', recursive=True):
              try: r=ET.parse(f).getroot()
              except Exception: continue
              for tc in r.iter('testcase'):
                  for k in ('failure','error'):
                      e=tc.find(k)
                      if e is not None:
                          body=(e.text or '').strip().splitlines()
                          cause=[l.strip() for l in body if 'Caused by' in l][-2:]
                          fails.append(f"{tc.get('classname')}#{tc.get('name')} [{k}] {(e.get('message') or '')[:300]} || {' || '.join(cause)[:500]}")
          print(f"::notice title=diag-count::failing testcases {len(fails)}")
          for i in range(0, min(len(fails), 72), 8):
              msg=' ### '.join(fails[i:i+8]).replace('%','%25').replace('\r','').replace('\n',' ')
              print(f"::error title=diag-fail-{i}::{msg[:7000]}")
          log=open('mvn-integration.log',errors='replace').read().splitlines()
          errs=[l for l in log if l.startswith('[ERROR]')][:60]
          print(f"::warning title=diag-mvn-errors::{' ### '.join(errs)[:7000].replace('%','%25')}")
          tail=log[-40:]
          print(f"::warning title=diag-mvn-tail::{' ### '.join(tail)[:7000].replace('%','%25')}")
          EOF
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-reports
          path: backend/**/target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 7

  cpq-beta-python:
    name: CPQ Beta (Python / Frappe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python tests
        run: bash scripts/ci/run-core.sh cpq-beta-python

  frontend:
    name: Frontend (Angular / NX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build, lint, test
        run: bash scripts/ci/run-core.sh frontend

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Security audit
        run: bash scripts/ci/run-core.sh security-audit
