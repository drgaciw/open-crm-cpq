# Manual fallback plus a nightly run of the full matrix on main — primary CI runs in Jenkins
# (see docs/ci-jenkins-cutover.md). Push/PR triggers stay disabled (Option B cutover); the nightly
# schedule exists because no Jenkins instance is reachable, so integration and frontend stages
# otherwise never run (ADR-003 section 8, amendment 2026-10-16).
name: CI (manual fallback)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read
  actions: write

jobs:
  shared-libraries:
    name: Shared Libraries (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      # Manual fallback has no Toolchain job; mirror blocking non-AI drift gate (ADR-003).
      - name: CI contract drift check
        run: python3 .cursor/skills/ci-contract-drift-check/scripts/verify-drift.py
      - name: Verify shared libraries
        run: bash scripts/ci/run-core.sh shared-libraries
      - name: Name failing tests
        if: failure()
        run: python3 scripts/ci/report-test-failures.py
      - name: Upload shared library test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-library-test-reports
          path: backend/libs/**/target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 7

  backend-unit:
    name: Backend Unit (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Fast unit verification
        run: bash scripts/ci/run-core.sh backend-unit
      - name: Name failing tests
        if: failure()
        run: python3 scripts/ci/report-test-failures.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-reports
          path: backend/**/target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 7

  backend-integration:
    name: Backend Integration (Testcontainers)
    runs-on: ubuntu-latest
    needs: [shared-libraries, backend-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Full Docker-backed verification
        run: bash scripts/ci/run-core.sh backend-integration
      - name: Name failing tests
        if: failure()
        run: python3 scripts/ci/report-test-failures.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-reports
          path: backend/**/target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 7

  cpq-beta-python:
    name: CPQ Beta (Python / Frappe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Run Python tests
        run: bash scripts/ci/run-core.sh cpq-beta-python

  frontend:
    name: Frontend (Angular / NX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build, lint, test
        run: bash scripts/ci/run-core.sh frontend

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Security audit
        run: bash scripts/ci/run-core.sh security-audit
