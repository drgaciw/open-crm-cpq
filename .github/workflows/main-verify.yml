# Post-merge gate on main (ADR-003 section 8, amendment 2026-10-16).
#
# Every pull request is checked on its own head by pr-check.yml, but nothing checked the head that
# results when several pull requests merge in a row. On 2026-10-16 two individually green pull
# requests (#612, #615) merged and main stopped compiling (DRG-613). This workflow runs the same
# Docker-free stage on every push to main, so the combined head gets a result.
#
# Concurrency is scoped by ref so a manual feature-branch or tag run cannot cancel main.
# In-progress runs cancel only for pull_request events. This workflow is push and
# workflow_dispatch, so a burst of merges queues instead of dropping an older main run.
#
# Self-hosted labels (CPQ_RUNS_ON, default ["self-hosted","linux","cpq"]) apply only to a push
# whose ref is refs/heads/main. workflow_dispatch and any other event or ref use ubuntu-latest.
# Testcontainers 1.21 stamps a per-JVM session id and Ryuk reaps that session only.
# This workflow does not remove other runs' containers.
#
# The full matrix (integration, frontend, cpq_beta, security audit) runs nightly from ci.yml.
#
# The report job (amendment 2026-11-10) keeps one open issue labelled main-red while main fails and
# closes it on the next green run, so a red main is visible without anyone opening the Actions tab.
name: Main verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-unit:
    name: Backend Unit (main)
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && fromJSON(vars.CPQ_RUNS_ON || '["self-hosted","linux","cpq"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      # Keep Ryuk on so a node-level disable cannot turn session reaping off.
      # Maven and npm caches are set in the next step: runner context is not valid in job env.
      TESTCONTAINERS_RYUK_DISABLED: 'false'
    steps:
      - name: Scope Maven and npm caches to this job
        run: |
          mkdir -p "$RUNNER_TEMP/m2" "$RUNNER_TEMP/npm-cache"
          if [ -n "${MAVEN_OPTS:-}" ]; then
            echo "MAVEN_OPTS=${MAVEN_OPTS} -Dmaven.repo.local=${RUNNER_TEMP}/m2" >> "$GITHUB_ENV"
          else
            echo "MAVEN_OPTS=-Dmaven.repo.local=${RUNNER_TEMP}/m2" >> "$GITHUB_ENV"
          fi
          echo "npm_config_cache=${RUNNER_TEMP}/npm-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - name: CI contract drift check
        run: python3 .cursor/skills/ci-contract-drift-check/scripts/verify-drift.py
      - name: Fast unit verification
        run: bash scripts/ci/run-core.sh backend-unit
      - name: Name failing tests
        if: failure()
        run: python3 scripts/ci/report-test-failures.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-verify-unit-test-reports
          path: backend/**/target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Wipe job workspace
        if: always()
        run: |
          # Drop this job's _work checkout. Leave RUNNER_TEMP so cache post-steps can save.
          cd /
          if [ -n "${GITHUB_WORKSPACE:-}" ] && [ -d "$GITHUB_WORKSPACE" ]; then
            case "$GITHUB_WORKSPACE" in
              */_work/*)
                rm -rf "$(dirname "$GITHUB_WORKSPACE")"
                ;;
              *)
                rm -rf "$GITHUB_WORKSPACE"
                ;;
            esac
          fi

  report:
    name: Report main status
    needs: backend-unit
    # Cancelled runs say nothing about main; manual runs on other refs are not main.
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.backend-unit.result == 'success' || needs.backend-unit.result == 'failure') }}
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && fromJSON(vars.CPQ_RUNS_ON || '["self-hosted","linux","cpq"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'false'
    steps:
      - name: Scope Maven and npm caches to this job
        run: |
          mkdir -p "$RUNNER_TEMP/m2" "$RUNNER_TEMP/npm-cache"
          if [ -n "${MAVEN_OPTS:-}" ]; then
            echo "MAVEN_OPTS=${MAVEN_OPTS} -Dmaven.repo.local=${RUNNER_TEMP}/m2" >> "$GITHUB_ENV"
          else
            echo "MAVEN_OPTS=-Dmaven.repo.local=${RUNNER_TEMP}/m2" >> "$GITHUB_ENV"
          fi
          echo "npm_config_cache=${RUNNER_TEMP}/npm-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Open or close the main-red issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/report-main-status.sh "${{ needs.backend-unit.result }}"
      - name: Wipe job workspace
        if: always()
        run: |
          # Drop this job's _work checkout. Leave RUNNER_TEMP so cache post-steps can save.
          cd /
          if [ -n "${GITHUB_WORKSPACE:-}" ] && [ -d "$GITHUB_WORKSPACE" ]; then
            case "$GITHUB_WORKSPACE" in
              */_work/*)
                rm -rf "$(dirname "$GITHUB_WORKSPACE")"
                ;;
              *)
                rm -rf "$GITHUB_WORKSPACE"
                ;;
            esac
          fi
