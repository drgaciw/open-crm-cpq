# Pull-request gate (ADR-003 amendment, 2026-09-28).
#
# Runs the same Docker-free stage that Jenkins runs (scripts/ci/run-core.sh backend-unit) plus the
# blocking CI-contract drift check, so the security-baseline and event-contract fitness tests
# (ADR-016, ADR-018) run on every pull request even while no Jenkins instance is reachable.
# Jenkins stays the primary CI and still owns integration, frontend and the AI assist stages.
name: PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend Unit (PR gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: CI contract drift check
        run: python3 .cursor/skills/ci-contract-drift-check/scripts/verify-drift.py
      - name: Fast unit verification
        run: bash scripts/ci/run-core.sh backend-unit
      - name: Name failing tests
        if: failure()
        run: python3 scripts/ci/report-test-failures.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-check-unit-test-reports
          path: backend/**/target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 7

  backend-integration:
    name: Backend Integration (Testcontainers, PR gate)
    runs-on: ubuntu-latest
    needs: [backend-unit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Full Docker-backed verification
        run: bash scripts/ci/run-core.sh backend-integration
      - name: Name failing tests
        if: failure()
        run: python3 scripts/ci/report-test-failures.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-check-integration-test-reports
          path: |
            backend/**/target/surefire-reports/*.xml
            **/target/restore-drill-report.json
          if-no-files-found: ignore
          retention-days: 7

  oms-browser:
    name: OMS Browser Acceptance (PR gate, Chromium + PostgreSQL)
    runs-on: ubuntu-24.04
    needs: [backend-unit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Required browser fixtures and live order acceptance
        run: bash scripts/ci/run-core.sh oms-browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-check-oms-browser-evidence
          path: |
            backend/services/order-management/target/surefire-reports/*OrderLiveBrowserUat*.xml
            **/target/restore-drill-report.json
            **/target/oms-browser-*.json
            **/target/oms-browser-*.png
            **/target/oms-browser-*.log
          if-no-files-found: warn
          retention-days: 7
