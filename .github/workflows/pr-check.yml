# Pull-request gate (ADR-003 amendment, 2026-09-28).
#
# Runs the same Docker-free stage that Jenkins runs (scripts/ci/run-core.sh backend-unit) plus the
# blocking CI-contract drift check, so the security-baseline and event-contract fitness tests
# (ADR-016, ADR-018) run on every pull request even while no Jenkins instance is reachable.
# The frontend job (ADR-003 section 7, amendment 2026-11-10) runs the same frontend stage as Jenkins
# and the nightly ci.yml, so a lockfile or Nx break is caught before merge.
# Jenkins stays the primary CI and still owns integration and the AI assist stages.
# flyway-order (DRG-774) is a separate hosted job. It is not a required check (NEEDS_OWNER).
name: PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend Unit (PR gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: CI contract drift check
        run: python3 .cursor/skills/ci-contract-drift-check/scripts/verify-drift.py
      - name: Fast unit verification
        run: bash scripts/ci/run-core.sh backend-unit
      - name: Name failing tests
        if: failure()
        run: python3 scripts/ci/report-test-failures.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-check-unit-test-reports
          path: backend/**/target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (PR gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build, lint, test
        run: bash scripts/ci/run-core.sh frontend

  frontend-npm-audit:
    name: Frontend npm audit (PR gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (high)
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

  # Hosted on every pull request. Not added to the Protect main ruleset.
  flyway-order:
    name: flyway-order
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch base ref
        env:
          GIT_TERMINAL_PROMPT: "0"
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$BASE_REF" in
            ''|*[!A-Za-z0-9._/-]*)
              echo "Refusing base ref" >&2
              exit 1
              ;;
          esac
          git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: Flyway migration order
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci/check-flyway-order.sh "origin/${BASE_REF}"
